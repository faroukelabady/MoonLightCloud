# Canonical local runtime. Works with `podman compose` and `docker compose`.
# Only standard concepts: HTTP + PostgreSQL + env + named volume.
name: moonlightcloud

services:
  postgres:
    image: docker.io/library/postgres:18.1-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: moonlight
      POSTGRES_PASSWORD: moonlight
      POSTGRES_DB: moonlight_dev
    volumes:
      # Single mount at the parent: the postgres:18 image keeps versioned
      # PGDATA below this path (see image docs). Do not mount .../data.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonlight -d moonlight_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  cloud:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://moonlight:moonlight@postgres:5432/moonlight_dev?sslmode=disable
      LOG_LEVEL: info
      # Local development only: explicit opt-in for unauthenticated reports.
      # Never set this outside development (startup refuses it elsewhere).
      ALLOW_UNAUTHENTICATED_REPORTING: "true"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Liveness for the container; orchestrator readiness is /health/ready.
      test: ["CMD", "/usr/local/bin/moonlight-cloud", "probe", "--url", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    name: moonlightcloud_pgdata

# Canonical local runtime. Works with `podman compose` and `docker compose`.
# Only standard concepts: HTTP + PostgreSQL + env + named volume.
name: moonlightcloud

services:
  postgres:
    image: docker.io/library/postgres:18.1-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: moonlight_dev
    volumes:
      # Single mount at the parent: the postgres:18 image keeps versioned
      # PGDATA below this path (see image docs). Do not mount .../data.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d moonlight_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  cloud:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://test:test@postgres:5432/moonlight_dev?sslmode=disable
      LOG_LEVEL: info
      # Image bytes (ADR-0057): set MEDIA_STORAGE=r2 and the R2_* values in
      # .env.local (scripts/dev-up.sh exports it) to use the dev bucket;
      # otherwise they stay in the media volume below (development only).
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_LOCAL_DIR: /var/lib/moonlight/media
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      NOTIFICATIONS_TELEGRAM_ENABLED: ${NOTIFICATIONS_TELEGRAM_ENABLED:-false}
      NOTIFICATIONS_TELEGRAM_PROVIDER_KEY: ${NOTIFICATIONS_TELEGRAM_PROVIDER_KEY:-telegram-main}
      NOTIFICATIONS_TELEGRAM_BOT_TOKEN: ${NOTIFICATIONS_TELEGRAM_BOT_TOKEN:-}
      BUSINESS_REPORTS_ENABLED: ${BUSINESS_REPORTS_ENABLED:-false}
      BUSINESS_REPORTS_POLL_INTERVAL: ${BUSINESS_REPORTS_POLL_INTERVAL:-60s}
      # Local development only: explicit opt-in for unauthenticated reports.
      # Never set this outside development (startup refuses it elsewhere).
      ALLOW_UNAUTHENTICATED_REPORTING: "true"
      # Human auth (ADR-0053): required; scripts/dev-up.sh generates a local
      # development key into .env.local on first run. No default account
      # exists: bootstrap one with `moonlight-cloud auth bootstrap-owner`.
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:?run scripts/dev-up.sh (generates a local key) or export AUTH_MFA_ENCRYPTION_KEY}
    volumes:
      - media:/var/lib/moonlight/media
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Liveness for the container; orchestrator readiness is /health/ready.
      test: ["CMD", "/usr/local/bin/moonlight-cloud", "probe", "--url", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    name: moonlightcloud_pgdata
  media:
    name: moonlightcloud_media

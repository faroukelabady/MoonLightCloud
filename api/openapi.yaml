openapi: 3.0.3
info:
  title: MoonLightCloud API
  description: >-
    Phase 1B: device lifecycle + versioned sync ingestion. Business APIs are
    versioned under /api/v1. Health and version stay outside the version
    boundary. ACK means durable PostgreSQL commit, never queueing alone.
  version: 1B
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /health/ready:
    get:
      summary: Readiness probe
      operationId: healthReady
      description: >-
        Returns 200 only when PostgreSQL is reachable and the schema is
        compatible. Otherwise 503.
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /version:
    get:
      summary: Build version metadata
      operationId: version
      responses:
        '200':
          description: Version metadata (no secrets).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/device/ping:
    get:
      summary: Authenticated device ping (proves device auth end to end)
      operationId: devicePing
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePing'
        '401':
          description: Missing, unknown, revoked, or invalid credential (no enumeration detail).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/capabilities:
    get:
      summary: Sync protocol capabilities for desktop compatibility
      operationId: syncCapabilities
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Protocol support, limits, server time. No internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          description: Missing, unknown, revoked, or invalid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/batches:
    post:
      summary: Durably ingest a batch of sync events (all-or-nothing)
      operationId: syncBatches
      security:
        - deviceAuth: []
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: application/json
          description: Must be application/json (415 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: >-
            Batch durably committed. Per-event accepted/already_accepted.
            ACK means PostgreSQL commit, not queueing or projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          description: Malformed envelope or duplicate IDs inside batch. Not retryable without fixing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid device authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Event device_id does not match authenticated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: EVENT_ID_REUSE — same event ID with different device or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Batch or payload exceeds limits. Shrink and resend as new batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unsupported event type or absurd timestamp. Not retryable as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Transient unavailability. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: '<device-id>.<credential-id>.<secret-hex> (raw secret shown once at provisioning/rotation)'
      description: >-
        Authorization: Bearer <device_uuid>.<credential_uuid>.<64-hex secret>.
        Never in query parameters. HTTPS in production.
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Version:
      type: object
      required: [app, version]
      properties:
        app:
          type: string
          example: moonlight-cloud
        version:
          type: string
          example: dev
        commit:
          type: string
          example: unknown
        build_time:
          type: string
          example: unknown
    DevicePing:
      type: object
      required: [device_id, authenticated]
      properties:
        device_id:
          type: string
          format: uuid
        authenticated:
          type: boolean
          example: true
    Capabilities:
      type: object
      required: [api_version, supported_events, max_batch_events, max_payload_bytes, max_body_bytes, server_time]
      properties:
        api_version:
          type: string
          example: v1
        supported_events:
          type: array
          items:
            type: string
          example: [system.test.v1, sale.finalized.v1]
        max_batch_events:
          type: integer
          example: 100
        max_payload_bytes:
          type: integer
          example: 262144
        max_body_bytes:
          type: integer
          example: 8388608
        server_time:
          type: string
          format: date-time
    SyncBatch:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
          format: uuid
          description: Optional client correlation, echoed back. Never replaces event idempotency.
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncEvent'
    SyncEvent:
      type: object
      required: [event_id, event_type, occurred_at, payload]
      properties:
        event_id:
          type: string
          format: uuid
          description: Generated once with the desktop outbox row; never regenerated on retry.
        event_type:
          type: string
          example: sale.finalized.v1
          description: >-
            Immutable name.version; only registered types are accepted
            (system.test.v1, sale.finalized.v1). v1 payload rules: integer
            minor-unit money, no floats; historical snapshots only.
        device_id:
          type: string
          format: uuid
          description: Optional echo; must equal the authenticated device.
        occurred_at:
          type: string
          format: date-time
          description: Business timestamp; bounded (2020-01-01 .. now+24h), never authority.
        payload:
          type: object
          description: Required JSON object, max 256 KiB. Money as integer minor units + currency.
    BatchResult:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            type: object
            required: [event_id, status]
            properties:
              event_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [accepted, already_accepted]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: invalid device credential

openapi: 3.0.3
info:
  title: MoonLightCloud API
  description: >-
    Device lifecycle + versioned sync ingestion with the first Sale-sync
    vertical slice: durable inbox, sale.finalized.v3 validated before ACK,
    async projection with durable processing state. Business APIs are
    versioned under /api/v1. Health and version stay outside the version
    boundary. ACK means durable PostgreSQL commit, never queueing alone.
  version: 2D
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /health/ready:
    get:
      summary: Readiness probe
      operationId: healthReady
      description: >-
        Returns 200 only when PostgreSQL is reachable and the schema is
        compatible. Otherwise 503.
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /version:
    get:
      summary: Build version metadata
      operationId: version
      responses:
        '200':
          description: Version metadata (no secrets).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/device-control/poll:
    post:
      summary: Retail control poll (lease at most one due command, refresh presence)
      operationId: deviceControlPoll
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Server time plus at most one leased command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceControlPollResponse'
        '401':
          description: Missing, unknown, revoked, or invalid credential (presence untouched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/commands/{id}/accepted:
    post:
      summary: Report durable Retail receipt (idempotent)
      operationId: deviceControlAccepted
      security:
        - deviceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current command state after accepted receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceControlCommandResponse'
        '401':
          description: Missing, unknown, revoked, or invalid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or cross-device lookup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/commands/{id}/status:
    post:
      summary: Report running/completed/failed (first terminal wins)
      operationId: deviceControlStatus
      security:
        - deviceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceControlStatusReport'
      responses:
        '200':
          description: Current command state after the report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceControlCommandResponse'
        '400':
          description: Malformed body, unknown status, or invalid result code (DEVICE_COMMAND_INVALID_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, unknown, revoked, or invalid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or cross-device lookup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Contradictory terminal outcome (DEVICE_COMMAND_CONFLICT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents:
    get:
      summary: Bounded incident list with state/severity/rule filters
      operationId: operationsIncidents
      security:
        - dashboardSession: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, acknowledged, resolved]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [warning, urgent]
        - name: rule
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One bounded page plus next_cursor (empty when final).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentList'
        '400':
          description: Invalid filter, limit, or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents/{id}:
    get:
      summary: Incident detail with masked deliveries and recovery state
      operationId: operationsIncidentDetail
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incident with deliveries (recipients masked) and recoveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentDetail'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents/{id}/acknowledge:
    post:
      summary: Acknowledge an incident (idempotent, never resolves)
      operationId: operationsAcknowledge
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current incident state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentResponse'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents/{id}/resolve:
    post:
      summary: Resolve an event incident, or a cleared stateful condition
      operationId: operationsResolve
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current incident state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentResponse'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Stateful condition still active (CONDITION_STILL_ACTIVE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/summary:
    get:
      summary: Aggregate counters and batched device incident rollup
      operationId: operationsSummary
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Low-cardinality counters plus per-device aggregates.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/devices/summary:
    get:
      summary: Per-device active incident counts in one batched read
      operationId: operationsDeviceSummary
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Device rollup array (never per-device queries).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/devices:
    get:
      summary: Operator device connectivity + latest sync command
      operationId: dashboardDevices
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Devices with never_seen/online/offline connectivity and the control-channel state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDeviceList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Create a Store-bound device and show its first credential once
      operationId: dashboardCreateDevice
      security:
        - dashboardSession: []
      description: >-
        Requires devices.manage, allowed Store scope, a FULL human session,
        same-origin CSRF evidence and a fresh one-use authenticator code.
        Credential responses are no-store and are never available again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [store_id, name, mfa_code]
              properties:
                store_id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 200}
                mfa_code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '201':
          description: Device, hashed credential and Store binding committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredentialIssued'
        '400':
          description: Invalid request fields.
        '401':
          description: Missing or invalid session.
        '403':
          description: Permission, Store scope, CSRF or fresh OTP refused.
        '404':
          description: Store or device not found.
        '409':
          description: Store exists, inactive Store or revoked device.
        '429':
          description: Authenticator attempts throttled; Retry-After applies.
        '503':
          description: Operation unavailable.

  /api/v1/dashboard/catalog-admin/commands:
    get:
      summary: Store-scoped catalog command history (newest first)
      operationId: catalogAdminListCommands
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
        - name: type
          in: query
          schema:
            type: string
          description: Optional versioned command type filter.
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
          description: Optional entity filter.
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, cancelled]
          description: Optional command status filter.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            Opaque keyset cursor from a previous response's next_cursor.
            Empty starts newest. Cursors are bound to the exact
            Store+filter scope; concurrent inserts never shift
            already-returned pages (no duplicates, no skips).
      responses:
        '200':
          description: Paginated command history with per-device targets and aggregate state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommandList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Create a typed Store-scoped catalog command (durable intent only)
      operationId: catalogAdminCreateCommand
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogAdminCreateRequest'
      responses:
        '200':
          description: "Command persisted with per-device targets snapshotted. Creation is not success: Retail must still apply it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommand'
        '400':
          description: Unknown type, cross-Store entity, unknown entity, or invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL), CSRF_REJECTED (mutations), or for a product, price or catalog change MFA_REQUIRED (no mfa_code) / MFA_INVALID (wrong or reused code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: CLOUD_PERMISSION_DISABLED — no device of the Store allows this kind of change (Retail Settings → Cloud sync → What Cloud may change).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED — too many wrong authenticator codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/permissions:
    get:
      summary: What the shop lets Cloud change for this Store
      operationId: catalogAdminPermissions
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Allowed change scopes advertised by the Store's devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminPermissions'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/commands/{id}:
    get:
      summary: One catalog command with targets and aggregate state
      operationId: catalogAdminGetCommand
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Command detail. Append ?payload=1 to include the immutable payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommand'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/commands/{id}/cancel:
    post:
      summary: Cancel a pending catalog command (never rolls back applied work)
      operationId: catalogAdminCancelCommand
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Command with updated state. Delivered or applied commands cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommand'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or cross-Store access (returned as not found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Command was delivered or applied and cannot be safely cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products:
    get:
      summary: Store-scoped admin Product list with pending flags
      operationId: catalogAdminProducts
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 64
          description: Bounded SKU/name substring. Empty lists newest.
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            Opaque scope-bound keyset cursor from a previous response's
            next_cursor. Empty starts newest. The cursor is bound to the
            exact Store+search scope that produced it; reuse under a
            different Store or search is rejected (400) rather than
            silently continuing another scope's list.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Products with SKU, revisions, online state, read-only stock and pending flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products/{id}:
    get:
      summary: Store-scoped admin Product detail snapshot
      operationId: catalogAdminProduct
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Current projection values plus all revision streams. Money stays exact minor-unit strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductDetail'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown Product or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products/{id}/configurations:
    get:
      summary: Current frame options for the editor
      operationId: catalogAdminConfigurations
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Current frame options with IDs so edits update rows instead of duplicating them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminConfigurationList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown Product or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products/{id}/variants:
    get:
      summary: Projected product variants (Phase 17)
      operationId: catalogAdminProductVariants
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Variant rows with option attributes, exact minor-unit prices and read-only last-known stock. Tombstones are flagged (deleted), never hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductVariantList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:

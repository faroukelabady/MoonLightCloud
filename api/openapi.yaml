openapi: 3.0.3
info:
  title: MoonLightCloud API
  description: >-
    Device lifecycle + versioned sync ingestion with the first Sale-sync
    vertical slice: durable inbox, sale.finalized.v1 validated before ACK,
    async projection with durable processing state. Business APIs are
    versioned under /api/v1. Health and version stay outside the version
    boundary. ACK means durable PostgreSQL commit, never queueing alone.
  version: 2D
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /health/ready:
    get:
      summary: Readiness probe
      operationId: healthReady
      description: >-
        Returns 200 only when PostgreSQL is reachable and the schema is
        compatible. Otherwise 503.
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /version:
    get:
      summary: Build version metadata
      operationId: version
      responses:
        '200':
          description: Version metadata (no secrets).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/device/ping:
    get:
      summary: Authenticated device ping (proves device auth end to end)
      operationId: devicePing
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePing'
        '401':
          description: Missing, unknown, revoked, or invalid credential (no enumeration detail).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/capabilities:
    get:
      summary: Sync protocol capabilities for desktop compatibility
      operationId: syncCapabilities
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Protocol support, limits, server time. No internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          description: Missing, unknown, revoked, or invalid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/batches:
    post:
      summary: Durably ingest a batch of sync events (all-or-nothing)
      operationId: syncBatches
      security:
        - deviceAuth: []
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: application/json
          description: Must be application/json (415 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: >-
            Batch durably committed. Per-event accepted/already_accepted.
            ACK means PostgreSQL commit, not queueing or projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          description: Malformed envelope or duplicate IDs inside batch. Not retryable without fixing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid device authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Event device_id does not match authenticated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: EVENT_ID_REUSE — same event ID with different device or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Batch or payload exceeds limits. Shrink and resend as new batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unsupported event type or absurd timestamp. Not retryable as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary reporting dependency unavailable (PostgreSQL unreachable/timeout). Generic UNAVAILABLE envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/auth/login:
    post:
      summary: Operator login (dashboard session)
      operationId: dashboardLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Authenticated; session cookie set (HttpOnly, Secure in production, SameSite=Lax).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSession'
        '401':
          description: Invalid operator credentials (generic, rate-limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many login attempts; Retry-After set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/auth/logout:
    post:
      summary: Operator logout (clears session cookie)
      operationId: dashboardLogout
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSession'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/auth/me:
    get:
      summary: Dashboard session state
      operationId: dashboardMe
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSession'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/overview:
    get:
      summary: Dashboard overview (frozen summary + normalized EGP total + FX info)
      operationId: dashboardOverview
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
      responses:
        '200':
          description: Overview with native buckets and normalized presentation values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
        '400':
          description: Invalid period or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/daily:
    get:
      summary: Daily trend in one currency mode (Cairo dates, ascending)
      operationId: dashboardDaily
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - name: mode
          in: query
          schema:
            type: string
            enum: [all, EGP, USD]
            default: all
          description: all = normalized EGP per Cairo date; EGP/USD = native buckets only (never converted). Contract metadata (mode, display_currency, normalized) travels with the data so mislabeling is impossible.
      responses:
        '200':
          description: Per-day amounts in the requested mode with explicit currency metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDaily'
        '400':
          description: Invalid period or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/products:
    get:
      summary: Top products (native per-currency or All normalized)
      operationId: dashboardProducts
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - name: mode
          in: query
          schema:
            type: string
            enum: [all, native]
          description: all = normalized EGP ranking (historical per-line FX); native = selected currency bucket.
        - $ref: '#/components/parameters/ReportCurrency'
      responses:
        '200':
          description: Unified rows {product_id, sku, product_name, units, amount_minor}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardProductList'
        '400':
          description: Invalid period, dates, or currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/categories:
    get:
      summary: Category performance (native or All normalized, roots/subcategories)
      operationId: dashboardCategories
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - name: kind
          in: query
          schema:
            type: string
            enum: [root_category, subcategory]
        - name: mode
          in: query
          schema:
            type: string
            enum: [all, native]
      responses:
        '200':
          description: Facet semantics preserved (subcategory rows may overlap).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardCategoryList'
        '400':
          description: Invalid period, dates, or kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/branches:
    get:
      summary: Branch/store breakdown from real shop snapshots
      operationId: dashboardBranches
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - $ref: '#/components/parameters/ReportCurrency'
      responses:
        '200':
          description: Rows grouped by full shop snapshot tuple + channel. No ONLINE fabrication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardBranchList'
        '400':
          description: Invalid period, dates, or currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/sync-health:
    get:
      summary: Cloud sync health (honest Cloud-side facts only)
      operationId: dashboardSyncHealth
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Freshness plus projector counts. cloud_projection_complete never proves Retail sync.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSyncHealth'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/activity:
    get:
      summary: Recent Cloud-side activity (bounded, latest-first)
      operationId: dashboardActivity
      security:
        - dashboardSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Accepted/projected/blocked events from authoritative rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardActivityList'
        '400':
          description: Invalid limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/sales/latest:
    get:
      summary: Latest finalized sales (orders fallback; no lifecycle model)
      operationId: dashboardLatestSales
      security:
        - dashboardSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Newest finalized Sale headers. No fabricated order statuses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardLatestSales'
        '400':
          description: Invalid limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal failure. Generic envelope, no internals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/reports/sales/summary:
    get:
      summary: Finalized-sales summary for a business period
      operationId: salesSummary
      security:
        - reportAuth: []
      description: >-
        Gross finalized sales (refunds not yet synchronized). Money in
        integer minor units, EGP and USD in separate buckets, never summed.
        Business days are STORE_TIMEZONE calendar days; timestamps are the
        sale occurred_at instants. Includes Cloud projection-freshness
        metadata (which does not prove Desktop sync completeness).
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - $ref: '#/components/parameters/ReportCurrency'
      responses:
        '200':
          description: Summary with currency buckets, payment totals, freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'
        '400':
          description: Invalid period, dates, range, or currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid reporting credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal reporting failure (e.g. aggregate overflow). Generic envelope, no internals. Not retryable as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary reporting dependency unavailable (PostgreSQL unreachable/timeout). Generic UNAVAILABLE envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/reports/sales/daily:
    get:
      summary: Daily finalized-sales series (store-local dates, ascending)
      operationId: salesDaily
      security:
        - reportAuth: []
      description: >-
        One row per store-local calendar date derived from occurred_at in
        STORE_TIMEZONE (never UTC date). Days group exactly the sales whose
        business timestamp falls in [local midnight, next local midnight).
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - $ref: '#/components/parameters/ReportCurrency'
      responses:
        '200':
          description: Daily rows with per-currency buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesDaily'
        '400':
          description: Invalid period, dates, range, or currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid reporting credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal reporting failure (e.g. aggregate overflow). Generic envelope, no internals. Not retryable as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary reporting dependency unavailable (PostgreSQL unreachable/timeout). Generic UNAVAILABLE envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/reports/sales/breakdown:
    get:
      summary: Dimension breakdown of finalized sales
      operationId: salesBreakdown
      security:
        - reportAuth: []
      description: >-
        Fixed dimensions only (product, root_category, subcategory, cashier,
        channel). Historical snapshots only. Root-category rows are additive;
        subcategory rows are facet-style and may sum above the line total.
        Product line_sales_minor excludes Sale-level discount/tax (no
        allocation). Unattributed sales form an explicit null cashier bucket.
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - $ref: '#/components/parameters/ReportCurrency'
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            enum: [product, root_category, subcategory, cashier, channel]
      responses:
        '200':
          description: Dimension rows, units descending with identity tie-break.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesBreakdown'
        '400':
          description: Invalid period, dates, range, currency, or dimension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid reporting credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal reporting failure (e.g. aggregate overflow). Generic envelope, no internals. Not retryable as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary reporting dependency unavailable (PostgreSQL unreachable/timeout). Generic UNAVAILABLE envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: '<device-id>.<credential-id>.<secret-hex> (raw secret shown once at provisioning/rotation)'
      description: >-
        Authorization: Bearer <device_uuid>.<credential_uuid>.<64-hex secret>.
        Never in query parameters. HTTPS in production.
    reportAuth:
      type: http
      scheme: bearer
      bearerFormat: 'REPORTING_API_TOKEN (temporary report-read secret until dashboard user auth)'
      description: >-
        Authorization: Bearer <reporting-api-token>. Report scope only;
        device sync credentials are never valid here. Fail-closed: required
        16+ chars in staging/production; open reports need ALL of
        ENVIRONMENT=development, ALLOW_UNAUTHENTICATED_REPORTING=true, and no
        token. Anything else (including missing ENVIRONMENT) fails startup.
    dashboardSession:
      type: apiKey
      in: cookie
      name: mlc_dash_session
      description: >-
        Operator session cookie (HttpOnly, Secure in production, SameSite=Lax).
        Minted by POST /api/v1/dashboard/auth/login after Argon2id credential
        verification. REPORTING_API_TOKEN is never valid here and never
        reaches the browser.
  parameters:
    ReportPeriod:
      name: period
      in: query
      required: true
      schema:
        type: string
        enum: [today, yesterday, last_10_completed_days, custom]
      description: >-
        today = local midnight through request now; yesterday = prior local
        day; last_10_completed_days = 10 completed local dates ending at
        today midnight (excludes the partial day); custom needs from/to dates.
    ReportFromDate:
      name: from_date
      in: query
      required: false
      schema:
        type: string
        example: 2026-09-01
      description: Inclusive local date (YYYY-MM-DD) for period=custom.
    ReportToDate:
      name: to_date
      in: query
      required: false
      schema:
        type: string
        example: 2026-09-15
      description: Inclusive local date (YYYY-MM-DD) for period=custom. Max 366 days.
    ReportCurrency:
      name: currency
      in: query
      required: false
      schema:
        type: string
        enum: [EGP, USD]
      description: Optional single-currency filter. Absent means all currencies in separate buckets.
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Version:
      type: object
      required: [app, version]
      properties:
        app:
          type: string
          example: moonlight-cloud
        version:
          type: string
          example: dev
        commit:
          type: string
          example: unknown
        build_time:
          type: string
          example: unknown
    DevicePing:
      type: object
      required: [device_id, authenticated]
      properties:
        device_id:
          type: string
          format: uuid
        authenticated:
          type: boolean
          example: true
    Capabilities:
      type: object
      required: [api_version, supported_events, max_batch_events, max_payload_bytes, max_body_bytes, server_time]
      properties:
        api_version:
          type: string
          example: v1
        supported_events:
          type: array
          items:
            type: string
          example: [system.test.v1, sale.finalized.v1]
        max_batch_events:
          type: integer
          example: 100
        max_payload_bytes:
          type: integer
          example: 262144
        max_body_bytes:
          type: integer
          example: 8388608
        server_time:
          type: string
          format: date-time
    SyncBatch:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
          format: uuid
          description: Optional client correlation, echoed back. Never replaces event idempotency.
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncEvent'
    SyncEvent:
      oneOf:
        - $ref: '#/components/schemas/SaleFinalizedV1Event'
        - $ref: '#/components/schemas/SystemTestV1Event'
      discriminator:
        propertyName: event_type
        mapping:
          sale.finalized.v1: '#/components/schemas/SaleFinalizedV1Event'
          system.test.v1: '#/components/schemas/SystemTestV1Event'
    SyncEventEnvelope:
      type: object
      required: [event_id, event_type, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Generated once with the desktop outbox row; never regenerated on retry.
        device_id:
          type: string
          format: uuid
          description: Optional echo; must equal the authenticated device.
        occurred_at:
          type: string
          format: date-time
          description: Business timestamp; bounded (2020-01-01 .. now+24h), never authority.
    SaleFinalizedV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [sale.finalized.v1]
            payload:
              $ref: '#/components/schemas/SaleFinalizedV1'
    SystemTestV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [system.test.v1]
            payload:
              type: object
              description: Diagnostic ping object, max 256 KiB.
    BatchResult:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            type: object
            required: [event_id, status]
            properties:
              event_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [accepted, already_accepted]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: invalid device credential
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Integer minor units only. Floats are rejected.
          example: 1250
        currency:
          type: string
          enum: [EGP, USD]
    FxSnapshot:
      type: object
      required: [base, quote, rate, rate_microrate]
      properties:
        base:
          type: string
          example: USD
        quote:
          type: string
          example: EGP
        rate:
          type: string
          description: Exact decimal string; rate_microrate must equal rate × 1000000.
          example: "52.000000"
        rate_microrate:
          type: integer
          format: int64
          example: 52000000
      description: Required for USD sales with the exact USD→EGP pair; absent for EGP sales.
    ShopSnapshot:
      type: object
      required: [name_ar, name_en, address_ar, address_en, phone, receipt_footer_ar, receipt_footer_en]
      properties:
        name_ar: {type: string}
        name_en: {type: string}
        address_ar: {type: string}
        address_en: {type: string}
        phone: {type: string}
        receipt_footer_ar: {type: string}
        receipt_footer_en: {type: string}
    ActorSnapshot:
      type: object
      properties:
        cashier_id: {type: string, format: uuid, nullable: true}
        cashier_name: {type: string, nullable: true}
    ClassificationSnapshot:
      type: object
      required: [category_id, name_ar, name_en]
      properties:
        category_id: {type: string, format: uuid}
        name_ar: {type: string}
        name_en: {type: string}
    LineClassifications:
      type: object
      required: [roots, subcategories]
      properties:
        roots:
          type: array
          minItems: 1
          maxItems: 1
          items: {$ref: '#/components/schemas/ClassificationSnapshot'}
          description: Exactly one root per line (Retail parity).
        subcategories:
          type: array
          items: {$ref: '#/components/schemas/ClassificationSnapshot'}
    SaleLine:
      type: object
      required: [sale_item_id, sku, product_name, quantity, unit_price, line_total, classifications]
      properties:
        sale_item_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid, nullable: true}
        variant_id: {type: string, format: uuid, nullable: true}
        sku: {type: string}
        product_name: {type: string}
        width_cm: {type: integer, nullable: true}
        height_cm: {type: integer, nullable: true}
        quantity: {type: integer, minimum: 1}
        unit_price: {$ref: '#/components/schemas/Money'}
        cost: {$ref: '#/components/schemas/Money'}
        line_total: {$ref: '#/components/schemas/Money'}
        classifications: {$ref: '#/components/schemas/LineClassifications'}
    EventPayment:
      type: object
      required: [method, amount, change_given]
      properties:
        method: {type: string, enum: [cash, card]}
        amount: {$ref: '#/components/schemas/Money'}
        change_given: {$ref: '#/components/schemas/Money'}
        transaction_ref: {type: string, nullable: true}
      description: Aggregate SUM(amount) must equal the sale total within ±1 minor unit (change ignored).
    SaleTotals:
      type: object
      required: [subtotal, discount, tax, total]
      properties:
        subtotal: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        total: {$ref: '#/components/schemas/Money'}
    SaleFinalizedV1:
      type: object
      required: [sale_id, sale_number, channel, occurred_at, paid_at, shop, actor, currency, totals, lines, payments]
      properties:
        sale_id: {type: string, format: uuid}
        sale_number: {type: string}
        channel: {type: string, enum: [STORE]}
        occurred_at: {type: string, format: date-time}
        paid_at: {type: string, format: date-time}
        shop: {$ref: '#/components/schemas/ShopSnapshot'}
        actor: {$ref: '#/components/schemas/ActorSnapshot'}
        currency: {type: string, enum: [EGP, USD]}
        fx:
          $ref: '#/components/schemas/FxSnapshot'
        totals: {$ref: '#/components/schemas/SaleTotals'}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SaleLine'}
        payments:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventPayment'}
      description: >-
        sale.finalized.v1 — the only business event in this phase. No v2
        fields exist. Integer money throughout; subtotal = Σ lines;
        total = max(0, subtotal + tax − discount).
    CurrencyTotal:
      type: object
      required: [currency, subtotal_minor, discount_minor, tax_minor, sales_total_minor, line_cost_minor]
      properties:
        currency: {type: string, example: EGP}
        subtotal_minor: {type: integer, example: 100000}
        discount_minor: {type: integer, example: 5000}
        tax_minor: {type: integer, example: 14000}
        sales_total_minor:
          type: integer
          example: 109000
          description: Gross finalized sales (refunds not yet synchronized).
        line_cost_minor:
          type: integer
          description: Historical line cost snapshot sum; not a profit basis.
      description: One currency bucket. EGP and USD are never summed.
    PaymentTotal:
      type: object
      required: [method, currency, amount_minor, change_minor]
      properties:
        method: {type: string, enum: [cash, card]}
        currency: {type: string, example: EGP}
        amount_minor: {type: integer}
        change_minor: {type: integer}
      description: Tender by method; secondary to finalized Sale totals.
    PeriodMeta:
      type: object
      required: [kind, timezone, start_local, end_local_exclusive, start_utc, end_utc]
      properties:
        kind: {type: string, example: last_10_completed_days}
        timezone: {type: string, example: Africa/Cairo}
        start_local: {type: string, example: '2026-09-12T00:00:00+03:00'}
        end_local_exclusive: {type: string, example: '2026-09-22T00:00:00+03:00'}
        start_utc: {type: string, example: '2026-09-11T21:00:00Z'}
        end_utc: {type: string, example: '2026-09-21T21:00:00Z'}
    Freshness:
      type: object
      required: [projection_backlog_count, blocked_sale_event_count, cloud_projection_complete]
      properties:
        latest_sale_event_received_at: {type: string, format: date-time, nullable: true}
        latest_projected_sale_occurred_at: {type: string, format: date-time, nullable: true}
        projection_backlog_count: {type: integer}
        blocked_sale_event_count: {type: integer}
        cloud_projection_complete:
          type: boolean
          description: All accepted sale events terminal (processed/blocked), no backlog. Does NOT mean Retail is fully synchronized.
    SalesSummary:
      type: object
      required: [generated_at, timezone, period, transaction_count, units_sold, currency_totals, payment_totals, freshness]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        transaction_count: {type: integer}
        units_sold: {type: integer}
        currency_totals:
          type: array
          items: {$ref: '#/components/schemas/CurrencyTotal'}
        payment_totals:
          type: array
          items: {$ref: '#/components/schemas/PaymentTotal'}
        freshness: {$ref: '#/components/schemas/Freshness'}
    DailyRow:
      type: object
      required: [date, transactions, units, currency_totals]
      properties:
        date: {type: string, example: '2026-09-22', description: Store-local calendar date.}
        transactions: {type: integer}
        units: {type: integer}
        currency_totals:
          type: array
          items: {$ref: '#/components/schemas/CurrencyTotal'}
    SalesDaily:
      type: object
      required: [generated_at, timezone, period, days, freshness]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        days:
          type: array
          items: {$ref: '#/components/schemas/DailyRow'}
          description: Ascending store-local dates.
        freshness: {$ref: '#/components/schemas/Freshness'}
    LineSaleTotal:
      type: object
      additionalProperties: false
      required: [currency, line_sales_minor, line_cost_minor]
      properties:
        currency: {type: string}
        line_sales_minor:
          type: integer
          description: Pre-adjustment line snapshot total; Sale-level discount/tax never allocated.
        line_cost_minor:
          type: integer
          description: Extended historical cost (unit cost × quantity); snapshot sum, not a profit basis.
    SaleCurrencyTotal:
      type: object
      additionalProperties: false
      required: [currency, subtotal_minor, discount_minor, tax_minor, sales_total_minor]
      properties:
        currency: {type: string}
        subtotal_minor: {type: integer}
        discount_minor: {type: integer}
        tax_minor: {type: integer}
        sales_total_minor:
          type: integer
          description: Gross finalized sales (refunds not yet synchronized).
      description: >-
        Sale-header currency bucket for cashier/channel rows. No cost field
        by design: header dimensions do not compute historical cost.
    LineBreakdownRow:
      type: object
      additionalProperties: false
      required: [dimension, units, line_sales]
      description: >-
        Line-level dimension row (product, root_category, subcategory).
        line_sales carries pre-adjustment historical line amounts;
        Sale-level discount/tax are never allocated. Never carries
        currency_totals.
      properties:
        dimension: {type: string, enum: [product, root_category, subcategory]}
        product_id: {type: string, format: uuid, nullable: true}
        sku: {type: string, nullable: true}
        product_name: {type: string, nullable: true}
        classification_kind: {type: string, enum: [root, subcategory]}
        classification_id: {type: string, format: uuid}
        name_ar: {type: string}
        name_en: {type: string}
        units: {type: integer}
        line_sales:
          type: array
          items: {$ref: '#/components/schemas/LineSaleTotal'}
          description: Subcategory rows are facet-style and may sum above the line total.
    HeaderBreakdownRow:
      type: object
      additionalProperties: false
      required: [dimension, transactions, units, currency_totals]
      description: >-
        Sale-header dimension row (cashier, channel). currency_totals
        carries exact header subtotal/discount/tax/sales_total. Never
        carries line_sales or any cost field.
      properties:
        dimension: {type: string, enum: [cashier, channel]}
        cashier_id: {type: string, nullable: true, description: Null means unattributed bucket.}
        cashier_name: {type: string, nullable: true}
        channel: {type: string}
        transactions: {type: integer}
        units: {type: integer}
        currency_totals:
          type: array
          items: {$ref: '#/components/schemas/SaleCurrencyTotal'}
    BreakdownRow:
      oneOf:
        - $ref: '#/components/schemas/LineBreakdownRow'
        - $ref: '#/components/schemas/HeaderBreakdownRow'
      description: >-
        One dimension value, structurally split by family. Consumers must
        not infer shape from dimension names alone: validate against the
        oneOf branches.
    SalesBreakdown:
      type: object
      required: [generated_at, timezone, period, dimension, rows, freshness]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        dimension: {type: string, enum: [product, root_category, subcategory, cashier, channel]}
        rows:
          type: array
          items: {$ref: '#/components/schemas/BreakdownRow'}
          description: Units descending, deterministic identity tie-break.
        freshness: {$ref: '#/components/schemas/Freshness'}
    DashboardSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: {type: boolean}
        username: {type: string}
    DashboardNormalized:
      type: object
      required: [normalized_total_minor, transactions, units, usd_sale_count]
      properties:
        normalized_total_minor:
          type: string
          description: Exact EGP minor units (string, never float). Native EGP plus each USD sale converted with its own historical FX microrate (PostgreSQL numeric rounding, documented).
        transactions: {type: integer}
        units: {type: integer}
        usd_sale_count: {type: integer}
    DashboardFx:
      type: object
      required: [has_usd, multiple_rates_used]
      properties:
        has_usd: {type: boolean}
        latest_rate: {type: string, description: Exact decimal string of the latest historical USD sale rate. Never a live market rate.}
        latest_rate_microrate: {type: string}
        latest_occurred_at: {type: string, format: date-time}
        min_rate_microrate: {type: string}
        max_rate_microrate: {type: string}
        multiple_rates_used: {type: boolean}
    DashboardSummaryBucket:
      type: object
      required: [currency, subtotal_minor, discount_minor, tax_minor, sales_total_minor, line_cost_minor]
      properties:
        currency: {type: string}
        subtotal_minor: {type: string}
        discount_minor: {type: string}
        tax_minor: {type: string}
        sales_total_minor: {type: string, description: Gross finalized sales (refunds not yet synchronized).}
        line_cost_minor: {type: string, description: Extended historical cost (unit cost × quantity).}
      description: String-backed money (never JSON numbers). Same numbers as Phase 3A, decimal-string encoding.
    DashboardSummaryPayment:
      type: object
      required: [method, currency, amount_minor, change_minor]
      properties:
        method: {type: string}
        currency: {type: string}
        amount_minor: {type: string}
        change_minor: {type: string}
    DashboardModeAverage:
      type: object
      required: [transactions, units, average_minor]
      properties:
        transactions: {type: integer, description: Transaction count for this mode only (never the all-currency count).}
        units: {type: integer, description: Units sold for this mode only (never the all-currency count).}
        average_minor: {type: string, description: Server-computed truncating integer division of the mode total by the mode count.}
    DashboardOverview:
      type: object
      required: [generated_at, timezone, period, summary, normalized, averages, fx]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        summary:
          type: object
          required: [transaction_count, units_sold, currency_totals, payment_totals]
          properties:
            transaction_count: {type: integer}
            units_sold: {type: integer}
            currency_totals:
              type: array
              items: {$ref: '#/components/schemas/DashboardSummaryBucket'}
            payment_totals:
              type: array
              items: {$ref: '#/components/schemas/DashboardSummaryPayment'}
        normalized: {$ref: '#/components/schemas/DashboardNormalized'}
        averages:
          type: object
          required: [all, egp, usd]
          properties:
            all: {$ref: '#/components/schemas/DashboardModeAverage'}
            egp: {$ref: '#/components/schemas/DashboardModeAverage'}
            usd: {$ref: '#/components/schemas/DashboardModeAverage'}
          description: Per-mode server averages (truncating division). Absent currencies report zero transactions with zero average.
        fx: {$ref: '#/components/schemas/DashboardFx'}
    DashboardDaily:
      type: object
      required: [timezone, period, mode, display_currency, normalized, days]
      properties:
        timezone: {type: string}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        mode: {type: string, enum: [all, EGP, USD]}
        display_currency: {type: string, description: Currency unit of amount_minor. Never relabeled client-side.}
        normalized: {type: boolean, description: True only for All mode (historical per-sale FX).}
        days:
          type: array
          items:
            type: object
            required: [date, transactions, units, amount_minor]
            properties:
              date: {type: string, description: Store-local calendar date.}
              transactions: {type: integer}
              units: {type: integer}
              amount_minor: {type: string, description: Exact minor units in display_currency (normalized EGP in All mode).}
    DashboardProductList:
      type: object
      required: [timezone, period, mode, unit, rows]
      properties:
        timezone: {type: string}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        mode: {type: string, enum: [all, native]}
        unit: {type: string, description: "EGP-normalized in All mode, else the native currency."}
        rows:
          type: array
          items:
            type: object
            required: [sku, product_name, units, amount_minor]
            properties:
              product_id: {type: string, format: uuid, nullable: true}
              sku: {type: string}
              product_name: {type: string}
              units: {type: integer}
              amount_minor: {type: string, description: Exact minor units (normalized EGP in All mode).}
    DashboardCategoryList:
      type: object
      required: [timezone, period, mode, unit, kind, rows]
      properties:
        timezone: {type: string}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        mode: {type: string, enum: [all, native]}
        unit: {type: string}
        kind: {type: string, enum: [root_category, subcategory]}
        rows:
          type: array
          items:
            type: object
            required: [kind, classification_id, name_ar, name_en, units, amount_minor]
            properties:
              kind: {type: string}
              classification_id: {type: string, format: uuid}
              name_ar: {type: string}
              name_en: {type: string}
              units: {type: integer}
              amount_minor: {type: string, description: Facet semantics preserved for subcategories.}
    DashboardBranchList:
      type: object
      required: [timezone, period, rows]
      properties:
        timezone: {type: string}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        rows:
          type: array
          items:
            type: object
            required: [shop_name_ar, shop_name_en, channel, currency, transactions, units, subtotal_minor, sales_total_minor]
            properties:
              shop_name_ar: {type: string}
              shop_name_en: {type: string}
              shop_address_ar: {type: string}
              shop_address_en: {type: string}
              shop_phone: {type: string}
              channel: {type: string}
              currency: {type: string}
              transactions: {type: integer}
              units: {type: integer}
              subtotal_minor: {type: string}
              discount_minor: {type: string}
              tax_minor: {type: string}
              sales_total_minor: {type: string}
          description: Grouped by full historical shop snapshot tuple + channel. Native buckets only. No ONLINE fabrication.
    DashboardSyncHealth:
      type: object
      required: [freshness, queue_count, pending_count, processed_count, blocked_count, retry_count]
      properties:
        freshness: {$ref: '#/components/schemas/Freshness'}
        queue_count: {type: integer, description: In-queue events (pending + retry counted exactly once).}
        pending_count: {type: integer}
        processed_count: {type: integer}
        blocked_count: {type: integer}
        retry_count: {type: integer}
        oldest_pending_at: {type: string, format: date-time, nullable: true}
        last_error_event: {type: string}
        last_error_code: {type: string, description: Safe error code only; raw stored messages never cross into browser JSON.}
        last_error_label_ar: {type: string}
        last_error_label_en: {type: string}
      description: cloud_projection_complete never proves Retail sync completeness.
    DashboardActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, event_id, event_type, timestamp]
            properties:
              kind: {type: string, enum: [accepted, projected, blocked]}
              event_id: {type: string, format: uuid}
              event_type: {type: string}
              timestamp: {type: string, format: date-time}
              device_name: {type: string, nullable: true}
              detail: {type: string, nullable: true, description: "Blocked error code, if any."}
    DashboardLatestSales:
      type: object
      required: [sales]
      properties:
        sales:
          type: array
          items:
            type: object
            required: [sale_id, sale_number, channel, occurred_at, currency, total_minor]
            properties:
              sale_id: {type: string, format: uuid}
              sale_number: {type: string}
              channel: {type: string}
              occurred_at: {type: string, format: date-time}
              currency: {type: string}
              total_minor: {type: string}
              cashier_id: {type: string, nullable: true}
              cashier_name: {type: string, nullable: true}
          description: Latest finalized sales. No order lifecycle exists; no statuses fabricated.

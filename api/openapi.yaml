  /api/v1/dashboard/orders/summary:
    get:
      summary: Online-order operational analytics (NOT Retail financial revenue)
      operationId: dashboardOrderAnalytics
      security:
        - dashboardSession: []
      description: >-
        Operational aggregation of durable provider online-order state
        (WooCommerce, Shopify, provider-neutral) over a period. These are
        OPERATIONAL metrics — order counts, order value, status
        distribution — and are NEVER added to canonical finalized Retail
        Sales revenue: an online order may later be represented by a
        finalized Sale or otherwise duplicate business activity. Money is
        exact minor units serialized as strings, per currency bucket (no
        FX, no cross-currency sums). "Active" metrics cover exactly the
        PENDING/PROCESSING/ON_HOLD/COMPLETED status set; cancelled,
        deleted, refunded, failed and unknown orders appear only in the
        status breakdown. Read-only durable state: no provider is contacted.
      parameters:

          required: [categories, subcategories, tags]
          properties:
            categories: {type: array, items: {type: object, required: [id, name_ar, name_en], properties: {id: {type: string, format: uuid}, name_ar: {type: string}, name_en: {type: string}}}}
            subcategories: {type: array, items: {type: object, required: [id, name_ar, name_en], properties: {id: {type: string, format: uuid}, name_ar: {type: string}, name_en: {type: string}}}}
            tags: {type: array, items: {type: object, required: [id, name_ar, name_en], properties: {id: {type: string, format: uuid}, name_ar: {type: string}, name_en: {type: string}}}}
        summary:
          type: array
          description: One row per report currency.
          items:
            type: object
            required: [currency, sales_count, items_sold, gross_minor, discount_minor, tax_minor, sales_minor, cost_minor, missing_cost_items, return_count, returned_items, refund_minor, refunded_tax_minor, restocked_cost_minor, net_sales_minor, net_tax_minor, net_revenue_minor, net_cost_minor, profit_minor]
            properties:
              currency: {type: string, enum: [EGP, USD]}
              sales_count: {type: integer}
              items_sold: {type: integer}
              gross_minor: {type: string, description: Exact minor units as a decimal string.}
              discount_minor: {type: string, description: Exact minor units as a decimal string.}
              tax_minor: {type: string, description: Exact minor units as a decimal string.}
              sales_minor: {type: string, description: Exact minor units as a decimal string.}
              cost_minor: {type: string, description: Exact minor units as a decimal string.}
              missing_cost_items: {type: integer}
              return_count: {type: integer}
              returned_items: {type: integer}
              refund_minor: {type: string, description: Exact minor units as a decimal string.}
              refunded_tax_minor: {type: string, description: Exact minor units as a decimal string.}
              restocked_cost_minor: {type: string, description: Exact minor units as a decimal string.}
              net_sales_minor: {type: string, description: Exact minor units as a decimal string.}
              net_tax_minor: {type: string, description: Exact minor units as a decimal string.}
              net_revenue_minor: {type: string, description: Exact minor units as a decimal string.}
              net_cost_minor: {type: string, description: Exact minor units as a decimal string.}
              profit_minor: {type: string, description: 'net_revenue_minor - net_cost_minor (exact minor units).'}
        base:
          type: object
          description: The whole period in EGP whatever the display currency.
          required: [sales_minor, net_sales_minor, profit_minor, missing_cost_items]
          properties:
            sales_minor: {type: string, description: Exact minor units as a decimal string.}
            net_sales_minor: {type: string, description: Exact minor units as a decimal string.}
            profit_minor: {type: string, description: Exact minor units as a decimal string.}
            missing_cost_items: {type: integer}
        daily:
          type: array
          items:
            type: object
            required: [date, currency, sales_count, items_sold, sales_minor, cost_minor, missing_cost_items, returned_items, refund_minor, net_sales_minor]
            properties:
              date: {type: string, format: date}
              currency: {type: string, enum: [EGP, USD]}
              sales_count: {type: integer}
              items_sold: {type: integer}
              sales_minor: {type: string, description: Exact minor units as a decimal string.}
              cost_minor: {type: string, description: Exact minor units as a decimal string.}
              missing_cost_items: {type: integer}
              returned_items: {type: integer}
              refund_minor: {type: string, description: Exact minor units as a decimal string.}
              net_sales_minor: {type: string, description: Exact minor units as a decimal string.}
        categories: {type: array, items: {$ref: '#/components/schemas/DashboardReportGroupRow'}}
        subcategories: {type: array, items: {$ref: '#/components/schemas/DashboardReportGroupRow'}}
        tags: {type: array, description: Tag totals overlap and must not be summed., items: {$ref: '#/components/schemas/DashboardReportGroupRow'}}
        products: {type: array, items: {$ref: '#/components/schemas/DashboardReportGroupRow'}}
        payments:
          type: array
          items:
            type: object
            required: [method, currency, payment_count, amount_minor, refund_minor, net_minor]
            properties:
              method: {type: string, enum: [cash, card, other]}
              currency: {type: string, enum: [EGP, USD]}
              payment_count: {type: integer}
              amount_minor: {type: string, description: Exact minor units as a decimal string.}
              refund_minor: {type: string, description: Exact minor units as a decimal string.}
              net_minor: {type: string, description: Exact minor units as a decimal string.}
        sales:
          type: array
          description: One page of Sales, newest first.
          items:
            type: object
            required: [sale_id, sale_number, occurred_at, currency, products, skus, root_names_ar, root_names_en, subcategory_names_ar, subcategory_names_en, items_sold, payment_methods, cost_minor, missing_cost_items, total_minor, original_currency, original_total_minor, rate_microrate]
            properties:
              sale_id: {type: string, format: uuid}
              sale_number: {type: string}
              occurred_at: {type: string, format: date-time}
              currency: {type: string, enum: [EGP, USD]}
              products: {type: string}
              skus: {type: string}
              root_names_ar: {type: string}
              root_names_en: {type: string}
              subcategory_names_ar: {type: string}
              subcategory_names_en: {type: string}
              items_sold: {type: integer}
              payment_methods: {type: array, items: {type: string}}
              cost_minor: {type: string, description: Exact minor units as a decimal string.}
              missing_cost_items: {type: integer}
              total_minor: {type: string, description: Exact minor units as a decimal string.}
              original_currency: {type: string, enum: [EGP, USD], description: The currency the Sale was recorded in.}
              original_total_minor: {type: string, description: The Sale total as recorded (exact minor units).}
              rate_microrate: {type: string, nullable: true, description: 'USD->EGP rate x 1,000,000 that converted the Sale into the report currency; null when it is shown in its own currency.'}
              lines:
                type: array
                nullable: true
                items: {$ref: '#/components/schemas/RecordedSaleReportLine'}
        sales_total_count: {type: integer}
        unclassified_items: {type: integer}
        detail_offset: {type: integer}
        detail_limit: {type: integer}
        currency_mix:
          type: array
          description: The filtered Sales of the period per recorded currency (EGP first), as recorded and in the report currency.
          items:
            type: object
            required: [currency, sales_count, total_minor, report_currency, report_total_minor]
            properties:
              currency: {type: string, enum: [EGP, USD]}
              sales_count: {type: integer}
              total_minor: {type: string, description: As recorded (exact minor units).}
              report_currency: {type: string, enum: [EGP, USD]}
              report_total_minor: {type: string, description: In the report currency (exact minor units).}
        exchange_rate:
          type: object
          description: The USD->EGP rates behind the report. Rates change daily, so older Sales may use a different rate from the latest one.
          required: [latest, period_min_microrate, period_max_microrate]
          properties:
            latest:
              type: object
              nullable: true
              description: The rate in effect when the report was made; null when none is known.
              required: [rate_microrate, effective_at, source]
              properties:
                rate_microrate: {type: string, description: 'Rate x 1,000,000.'}
                effective_at: {type: string, format: date-time}
                source: {type: string, enum: [cloud, sale], description: 'cloud = set in Cloud settings; sale = the snapshot on the newest synced USD Sale.'}
            period_min_microrate: {type: string, nullable: true, description: Lowest rate the period's Sales used (a USD Sale's own snapshot always counts).}
            period_max_microrate: {type: string, nullable: true, description: Highest rate the period's Sales used.}
    DashboardStocktaking:
      type: object
      required: [generated_at, store_id, shop, totals, categories, items]
      properties:
        generated_at: {type: string, format: date-time}
        store_id: {type: string, format: uuid, nullable: true}
        shop: {$ref: '#/components/schemas/DashboardReportShop'}
        totals:
          type: object
          required: [products_in_stock, variants_in_stock, units, cost_minor, retail_minor, units_without_cost, units_without_price, inactive_units]
          properties:
            products_in_stock: {type: integer}
            variants_in_stock: {type: integer}
            units: {type: integer}
            cost_minor: {type: string, description: Exact minor units as a decimal string.}
            retail_minor: {type: string, description: Exact minor units as a decimal string.}
            units_without_cost: {type: integer}
            units_without_price: {type: integer}
            inactive_units: {type: integer}
        categories:
          type: array
          items:
            type: object
            required: [id, name_ar, name_en, products_in_stock, units, cost_minor, retail_minor]
            properties:
              id: {type: string, format: uuid}
              name_ar: {type: string}
              name_en: {type: string}
              products_in_stock: {type: integer}
              units: {type: integer}
              cost_minor: {type: string, description: Exact minor units as a decimal string.}
              retail_minor: {type: string, description: Exact minor units as a decimal string.}
        items:
          type: array
          items:
            type: object
            required: [variant_id, sku, product_name_ar, product_name_en, variant_name_ar, variant_name_en, category_id, active, quantity, unit_cost_minor, cost_minor, unit_price_minor, retail_minor]
            properties:
              variant_id: {type: string, format: uuid}
              sku: {type: string}
              product_name_ar: {type: string}
              product_name_en: {type: string}
              variant_name_ar: {type: string}
              variant_name_en: {type: string}
              category_id: {type: string, format: uuid}
              active: {type: boolean}
              quantity: {type: integer}
              unit_cost_minor: {type: string, nullable: true}
              cost_minor: {type: string, nullable: true}
              unit_price_minor: {type: string, nullable: true}
              retail_minor: {type: string, nullable: true}
    DashboardLatestSales:
      type: object
      required: [sales]
      properties:
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
        sales:
          type: array
          items:
            type: object
            required: [sale_id, sale_number, channel, occurred_at, currency, total_minor]
            properties:
              sale_id: {type: string, format: uuid}
              sale_number: {type: string}
              channel: {type: string}
              occurred_at: {type: string, format: date-time}
              currency: {type: string}
              total_minor: {type: string}
              cashier_id: {type: string, nullable: true}
              cashier_name: {type: string, nullable: true}
          description: Latest finalized sales. No order lifecycle exists; no statuses fabricated.
    ReleaseArtifactView:
      type: object
      required: [os, arch, package, file_name, size, sha256, url]
      properties:
        os: {type: string, enum: [linux, windows]}
        arch: {type: string, example: amd64}
        package: {type: string, enum: [tar.gz, nsis-exe]}
        file_name: {type: string}
        size: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        url: {type: string, format: uri, description: Operational HTTPS location; not part of the signed identity.}
    ReleaseView:
      type: object
      required: [id, manifest_digest, release_sequence, version, build_commit, min_installed_sequence, key_id, status, imported_by, imported_at, status_changed_by, status_changed_at, artifacts]
      properties:
        id: {type: string, format: uuid}
        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        release_sequence: {type: integer, format: int64, minimum: 1}
        version: {type: string}
        build_commit: {type: string}
        min_installed_sequence: {type: integer, format: int64, minimum: 0}
        key_id: {type: string, pattern: '^[0-9a-f]{16}$'}
        status: {type: string, enum: [active, revoked]}
        imported_by: {type: string}
        imported_at: {type: string, format: date-time}
        status_changed_by: {type: string}
        status_changed_at: {type: string, format: date-time}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/ReleaseArtifactView'}
    ReleaseImportRequest:
      type: object
      additionalProperties: false
      required: [envelope, artifact_urls]
      properties:
        envelope:
          description: >-
            The signed moonlight-release-envelope-v1 document, as a JSON object
            or as the file's literal text in a JSON string.
          oneOf:
            - type: object
            - type: string
        artifact_urls:
          type: object
          description: Signed artifact file name → HTTPS location; exactly one per signed artifact.
          additionalProperties: {type: string, format: uri}
    RolloutCreateRequest:
      type: object
      additionalProperties: false
      required: [release_id, scope, mode, percentage]
      properties:
        release_id: {type: string, format: uuid}
        scope: {type: string, enum: [device, store, all]}
        store_id: {type: string, format: uuid, description: Required for STORE scope.}
        device_id: {type: string, format: uuid, description: Required for DEVICE scope.}
        mode: {type: string, enum: [optional, mandatory]}
        percentage: {type: integer, minimum: 1, maximum: 100}
        not_before: {type: string, format: date-time, nullable: true}
    RolloutView:
      type: object
      required: [id, release_id, release_version, release_sequence, scope, mode, percentage, status, target_count, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        release_id: {type: string, format: uuid}
        release_version: {type: string}
        release_sequence: {type: integer, format: int64}
        scope: {type: string, enum: [device, store, all]}
        store_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        mode: {type: string, enum: [optional, mandatory]}
        percentage: {type: integer, minimum: 1, maximum: 100}
        status: {type: string, enum: [draft, active, paused, completed, cancelled]}
        not_before: {type: string, format: date-time}
        target_count: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        counts:
          type: object
          description: Target count per target state.
          additionalProperties: {type: integer}
    UpdateTargetState:
      type: string
      description: >-
        Cloud's view of one device target, driven only by authenticated Retail
        reports. SUCCEEDED is recorded only after Retail confirmed healthy
        startup of the new release.
      enum: [not_selected, pending, delivered, downloading, verified, waiting_safe_boundary, installing, awaiting_health, succeeded, already_compliant, failed, rolled_back, manual_action_required, skipped_newer, unsupported, cancelled]
    UpdateTargetView:
      type: object
      required: [id, rollout_id, device_id, device_name, store_id, state, attempt_count, updated_at]
      properties:
        id: {type: string, format: uuid}
        rollout_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        device_name: {type: string}
        store_id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/UpdateTargetState'}
        attempt_count: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_error: {type: string}
        delivered_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UpdateTargetEvent:
      type: object
      required: [reported_state, target_state, retryable, recorded_at]
      properties:
        reported_state: {type: string}
        target_state: {type: string}
        error_code: {type: string}
        retryable: {type: boolean}
        recorded_at: {type: string, format: date-time}
    FleetDeviceRow:
      type: object
      required: [device_id, device_name, device_status, store_id, release_sequence, updater_protocol, updater_capable, updater_reported]
      properties:
        device_id: {type: string, format: uuid}
        device_name: {type: string}
        device_status: {type: string}
        store_id: {type: string, format: uuid}
        last_seen_at: {type: string, format: date-time}
        version: {type: string}
        build_commit: {type: string}
        release_sequence: {type: integer, format: int64}
        os: {type: string}
        arch: {type: string}
        updater_protocol: {type: integer}
        updater_capable: {type: boolean}
        updater_reported: {type: boolean, description: False when the device never sent an update status report.}
        unsupported_reason: {type: string}
        update_state: {type: string}
        update_error: {type: string}
        reported_at: {type: string, format: date-time}
        target_id: {type: string, format: uuid}
        target_state: {type: string}
        target_error: {type: string}
        target_version: {type: string}
        target_sequence: {type: integer, format: int64}
        rollout_id: {type: string, format: uuid}
    UpdateAuditEvent:
      type: object
      required: [id, occurred_at, actor_kind, actor, action, details]
      properties:
        id: {type: integer, format: int64}
        occurred_at: {type: string, format: date-time}
        actor_kind: {type: string, enum: [operator, device, system]}
        actor: {type: string}
        action: {type: string, example: rollout.started}
        release_id: {type: string, format: uuid}
        rollout_id: {type: string, format: uuid}
        target_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        details: {type: object, additionalProperties: true}
    DeviceUpdateStatus:
      type: object
      additionalProperties: false
      required: [version, build_commit, release_sequence, os, arch, updater_protocol, updater_capable, update_state]
      properties:
        version: {type: string}
        build_commit: {type: string}
        release_sequence: {type: integer, format: int64, minimum: 0}
        os: {type: string}
        arch: {type: string}
        updater_protocol: {type: integer, minimum: 0}
        updater_capable: {type: boolean}
        unsupported_reason: {type: string, example: UPDATE_PLATFORM_UNSUPPORTED}
        update_state: {type: string, description: 'Retail journal state (idle, downloading, … succeeded, rolled_back, manual_action_required).'}
        update_error: {type: string}
        target_id: {type: string, format: uuid}
    DeviceUpdateCommand:
      type: object
      required: [target_id, type, version, release_id, manifest_digest, mode, not_before, envelope, artifact_url, release_status]
      properties:
        target_id: {type: string, format: uuid}
        type: {type: string, enum: [retail.update.install.v1]}
        version: {type: integer, enum: [1]}
        release_id: {type: string, format: uuid}
        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        mode: {type: string, enum: [optional, mandatory]}
        not_before: {type: string, format: date-time, nullable: true}
        envelope: {type: string, description: Exact signed envelope bytes as imported; Retail re-verifies them.}
        artifact_url: {type: string, format: uri}
        release_status: {type: string, enum: [active, revoked]}
    DeviceUpdateTargetReport:
      type: object
      additionalProperties: false
      required: [state, retryable, release_sequence]
      properties:
        state: {type: string}
        error_code: {type: string}
        retryable: {type: boolean}
        release_sequence: {type: integer, format: int64, minimum: 1}
        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: {type: string, maxLength: 254, description: 'Email or username; trimmed and lower-cased.'}
        password: {type: string}
    AuthSessionResult:
      type: object
      required: [stage, csrf_token]
      properties:
        stage: {type: string, enum: [mfa_pending, mfa_setup, full]}
        csrf_token: {type: string, description: 'Send as X-CSRF-Token on every mutation; keep in memory only.'}
        recovery_codes: {type: array, items: {type: string}, description: 'Present once, after MFA enrollment.'}
    AuthMe:
      type: object
      required: [authenticated, stage, csrf_token, user, permissions, all_stores, store_ids]
      properties:
        authenticated: {type: boolean}
        stage: {type: string, enum: [mfa_pending, mfa_setup, full]}
        csrf_token: {type: string}
        user:
          type: object
          properties:
            id: {type: string, format: uuid}
            login: {type: string}
            display_name: {type: string}
            role: {type: string, enum: [owner, admin]}
            mfa_enabled: {type: boolean}
        permissions: {type: array, items: {type: string}, description: 'Empty until the session is FULL.'}
        all_stores: {type: boolean}
        store_ids: {type: array, items: {type: string, format: uuid}}
        session:
          type: object
          properties:
            expires_at: {type: string, format: date-time}
            idle_timeout_seconds: {type: integer}
    HumanUser:
      type: object
      required: [id, login, display_name, role, status, all_stores, store_ids, mfa_enabled]
      properties:
        id: {type: string, format: uuid}
        login: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [owner, admin]}
        status: {type: string, enum: [pending_setup, active, disabled]}
        all_stores: {type: boolean}
        store_ids: {type: array, items: {type: string, format: uuid}}
        mfa_enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AuthAuditEvent:
      type: object
      required: [id, occurred_at, action, outcome, details]
      properties:
        id: {type: integer, format: int64}
        occurred_at: {type: string, format: date-time}
        actor_user_id: {type: string, format: uuid}
        target_user_id: {type: string, format: uuid}
        action: {type: string}
        outcome: {type: string, enum: [success, failure, denied]}
        reason: {type: string}
        client_ip: {type: string}
        details: {type: object, additionalProperties: true}

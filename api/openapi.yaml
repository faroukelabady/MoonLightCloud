  /api/v1/dashboard/reports/sales:
    get:
      summary: Printable sales report (the sections MoonLightRetail prints)
      description: >-
        Every section of the sales report for one period. currency=EGP (default)
        shows every Sale in EGP, converting USD Sales with their own FX snapshot;
        currency=USD shows every Sale in USD, converting EGP Sales with the
        Store's USD rate nearest the Sale (latest USD Sale at or before it, else
        the earliest after it); currency=all keeps each currency separate. Each
        Sale, line, payment and refund is converted on its own and rounded half
        away from zero, so sections can differ by one minor unit. Returns use
        their Sale's conversion. Sales details are paged. Cloud-entered
        exchange rates take precedence for EGP Sales shown in USD. Filters keep
        whole Sales (and their returns): a Sale stays when it has a payment of
        payment_method and one of its lines matches every given category,
        subcategory and tag list. With the business tax toggle off, totals and
        refunds exclude tax.
      operationId: dashboardSalesReport
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - $ref: '#/components/parameters/StoreScope'
        - name: currency
          in: query
          schema: {type: string, enum: [EGP, USD, all], default: EGP}
        - name: root_category_ids
          in: query
          description: Comma-separated root category UUIDs (at most 100).
          schema: {type: string}
        - name: subcategory_ids
          in: query
          description: Comma-separated subcategory UUIDs (at most 100).
          schema: {type: string}
        - name: tag_ids
          in: query
          description: Comma-separated tag UUIDs (at most 100).
          schema: {type: string}
        - name: payment_method
          in: query
          schema: {type: string, enum: [cash, card, other]}
        - name: detail_offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: detail_limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: The sales report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSalesReport'}
        '400':
          description: Invalid period, currency or detail page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: No valid session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership) or MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: EXCHANGE_RATE_REQUIRED (message) - an EGP Sale must be shown in USD but its Store has no USD Sale carrying a rate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500':
          description: Unexpected internal failure. Generic envelope. No internals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: Temporary dependency unavailable. Generic envelope. Retry with backoff.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

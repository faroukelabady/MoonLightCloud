          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/update-targets/{id}/history:
    get:
      summary: Append-only report history of one target
      operationId: dashboardUpdateTargetHistory
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/UpdateResourceID'
      responses:
        '200':
          description: History, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/UpdateTargetEvent'}
        '400':
          description: Malformed id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/fleet:
    get:
      summary: Devices with trusted version/updater report and current target
      description: >-
        Version fields come only from authenticated device status reports;
        updater_reported=false means the device never reported (e.g. a Phase 17
        Retail without the updater). States are exactly what Retail reported.
      operationId: dashboardFleet
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/UpdateStoreFilter'
        - $ref: '#/components/parameters/UpdateCursor'
        - $ref: '#/components/parameters/UpdatePageLimit'
      responses:
        '200':
          description: Fleet page.
          content:
            application/json:
              schema:
                type: object
                required: [devices, next_cursor]
                properties:
                  devices:
                    type: array
                    items: {$ref: '#/components/schemas/FleetDeviceRow'}
                  next_cursor: {type: string}
        '400':
          description: Invalid Store id or cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/update-audit:
    get:
      summary: Release/rollout/device update audit trail (newest first)
      operationId: dashboardUpdateAudit
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/UpdateStoreFilter'
        - name: before_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - $ref: '#/components/parameters/UpdatePageLimit'
      responses:
        '200':
          description: Audit page.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/UpdateAuditEvent'}
        '400':
          description: Invalid Store id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/update/status:
    post:
      summary: Retail reports its trusted version and updater state
      description: >-
        Device identity comes only from the credential; the body never names a
        device. Unknown fields are rejected.
      operationId: deviceUpdateStatus
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceUpdateStatus'}
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [server_time]
                properties:
                  server_time: {type: string, format: date-time}
        '400':
          description: Invalid or unknown fields.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing, invalid or revoked device credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/device-control/update/command:
    get:
      summary: Retail polls for its current install intent
      description: >-
        Returns at most one retail.update.install.v1 command for the
        authenticated device, or null. The command carries only the signed
        envelope (exact bytes), its digest, mode, schedule and one artifact
        location — never an executable command, script, path or argument.
        Retail re-verifies the envelope against its embedded public keys.
      operationId: deviceUpdateCommand
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Current command or null.
          content:
            application/json:
              schema:
                type: object
                required: [server_time, command]
                properties:
                  server_time: {type: string, format: date-time}
                  command:
                    allOf:
                      - $ref: '#/components/schemas/DeviceUpdateCommand'
                    nullable: true
        '401':
          description: Missing, invalid or revoked device credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/device-control/recovery/status:
    get:
      summary: Retail reads its Cloud-restore recovery requirement
      description: >-
        Phase 20 (ADR-0054). Device identity comes only from the credential.
        devices_unresolved and projections_pending are scoped to the
        requesting device's Store (active devices only); store_reconciled is
        true only when both are zero.
      operationId: deviceRecoveryStatus
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Recovery report.
          content:
            application/json:
              schema:
                type: object
                required: [required, devices_unresolved, projections_pending, store_reconciled]
                properties:
                  required: {type: boolean}
                  reason: {type: string, maxLength: 200}
                  devices_unresolved: {type: integer, minimum: 0}
                  instructions: {type: string}
                  projections_pending: {type: integer, minimum: 0}
                  store_reconciled: {type: boolean}
        '401':
          description: Missing, invalid or revoked device credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/device-control/recovery/verify/begin:
    post:
      summary: Retail starts a recovery verification generation
      description: >-
        Capture Cloud's accepted-event lower bound and open a generation
        before Retail captures its finite local retained-outbox snapshot.
        Every verification page must include the returned generation.
      operationId: deviceRecoveryVerifyBegin
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Generation bound to the authenticated device.
          content:
            application/json:
              schema:
                type: object
                required: [generation]
                properties:
                  generation: {type: integer, minimum: 1, format: int64}
        '400':
          description: Recovery is not required for this device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing, invalid or revoked device credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/device-control/recovery/verify:
    post:
      summary: Retail verifies one page of its retained event history
      description: >-
        One bounded page (1-200 identities) of retained (event_id,
        payload_hash) identities, strictly ascending by event_id in byte
        order and starting above the server's recorded cursor. Current clients
        include the generation returned by recovery/verify/begin on every
        page. The first page declares the count in Retail's finite SQLite
        insertion-bound snapshot; the server floors it at the event count
        captured when that generation began. The server records coverage and
        how many identities it does not hold. Legacy clients may still open a
        pass with a positive declared_total on their first page.
      operationId: deviceRecoveryVerify
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [event_id, payload_hash]
                    properties:
                      event_id: {type: string, format: uuid}
                      payload_hash: {type: string, description: lowercase hex SHA-256 of the canonical payload}
                end_of_history: {type: boolean}
                declared_total: {type: integer, minimum: 0, format: int64}
                generation: {type: integer, minimum: 1, format: int64}
      responses:
        '200':
          description: Identities Cloud does not hold (or holds with a different hash).
          content:
            application/json:
              schema:
                type: object
                required: [missing]
                properties:
                  missing:
                    type: array
                    items: {type: string, format: uuid}
                  cloud_event_count: {type: integer, description: informational only}
        '400':
          description: >-
            Invalid page (empty, oversized, not strictly ascending, not
            advancing the cursor, under-declared total, or recovery not active).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing, invalid or revoked device credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/device-control/recovery/complete:
    post:
      summary: Retail clears its recovery requirement after an exhaustive pass
      description: >-
        Succeeds only when the server's own ledger shows a complete walk
        (end_of_history), coverage reaching the declared total, and zero
        missing identities recorded in the pass. last_missing must be 0 but
        is never sufficient on its own.
      operationId: deviceRecoveryComplete
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                last_missing: {type: integer, minimum: 0}
      responses:
        '200':
          description: Requirement cleared for this device.
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: {type: boolean}
        '400':
          description: Ledger does not prove an exhaustive, zero-missing pass.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing, invalid or revoked device credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/device-control/update/targets/{id}/report:
    post:
      summary: Retail reports progress/outcome for one of its targets
      operationId: deviceUpdateTargetReport
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/UpdateResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceUpdateTargetReport'}
      responses:
        '200':
          description: Recorded; returns Cloud's target and release status.
          content:
            application/json:
              schema:
                type: object
                required: [target_state, release_status]
                properties:
                  target_state: {type: string}
                  release_status: {type: string, enum: [active, revoked]}
        '400':
          description: Invalid body or a report not matching the target release.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing, invalid or revoked device credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: Unknown target or a target belonging to another device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: '<device-id>.<credential-id>.<secret-hex> (raw secret shown once at provisioning/rotation)'
      description: >-
        Authorization: Bearer <device_uuid>.<credential_uuid>.<64-hex secret>.
        Never in query parameters. HTTPS in production.
    reportAuth:
      type: http
      scheme: bearer
      bearerFormat: 'REPORTING_API_TOKEN (temporary report-read secret until dashboard user auth)'
      description: >-
        Authorization: Bearer <reporting-api-token>. Report scope only;
        device sync credentials are never valid here. Fail-closed: required
        16+ chars in staging/production; open reports need ALL of
        ENVIRONMENT=development, ALLOW_UNAUTHENTICATED_REPORTING=true, and no
        token. Anything else (including missing ENVIRONMENT) fails startup.
    dashboardSession:
      type: apiKey
      in: cookie
      name: __Host-mlc_session
      description: >-
        Opaque server-side human session (ADR-0053): 256-bit random token,
        stored only as a digest. Cookie __Host-mlc_session (HttpOnly, Secure,
        SameSite=Strict, Path=/) outside development; mlc_session over plain
        HTTP in development. Every dashboard route also requires the FULL
        (MFA-complete) stage, a named permission and server-side Store
        membership; mutations additionally require a same-origin Origin/Referer
        and the X-CSRF-Token header. Device credentials and
        REPORTING_API_TOKEN are never valid here.
  parameters:
    TopNLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: >-
        Bounded Top-N size (explicit validation: 1..100; malformed, zero,
        negative and over-maximum values are rejected with 400 — never
        silently clamped). Ranking semantics never change with limit.
    ReportPeriod:
      name: period
      in: query
      required: true
      schema:
        type: string
        enum: [today, yesterday, last_10_completed_days, custom]
      description: >-
        today = local midnight through request now; yesterday = prior local
        day; last_10_completed_days = 10 completed local dates ending at
        today midnight (excludes the partial day); custom needs from/to dates.
    ReportFromDate:
      name: from_date
      in: query
      required: false
      schema:
        type: string
        example: 2026-09-01
      description: Inclusive local date (YYYY-MM-DD) for period=custom.
    ReportToDate:
      name: to_date
      in: query
      required: false
      schema:
        type: string
        example: 2026-09-15
      description: Inclusive local date (YYYY-MM-DD) for period=custom. Max 366 days.
    ReportCurrency:
      name: currency
      in: query
      required: false
      schema:
        type: string
        enum: [EGP, USD]
      description: Optional single-currency filter. Absent means all currencies in separate buckets.
    StoreScope:
      name: store_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: >-
        Optional Store ownership scope (Store UUID). Absent means global
        scope (all Stores plus legacy unscoped rows, backward compatible).
        A malformed UUID is a 400; an unknown Store yields empty results,
        never a silent fallback to global. Legacy NULL rows never match a
        specific Store.
    UpdateResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UpdateStoreFilter:
      name: store_id
      in: query
      description: Optional Store scope; omitted means all Stores.
      schema: {type: string, format: uuid}
    UpdateCursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from next_cursor; bound to the same scope and rejected for another.
      schema: {type: string, maxLength: 512}
    UpdatePageLimit:
      name: limit
      in: query
      description: Page size 1..100; other values use the default (50).
      schema: {type: integer, minimum: 1, maximum: 100}
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Version:
      type: object
      required: [app, version]
      properties:
        app:
          type: string
          example: moonlight-cloud
        version:
          type: string
          example: dev
        commit:
          type: string
          example: unknown
        build_time:
          type: string
          example: unknown
    DevicePing:
      type: object
      required: [device_id, authenticated]
      properties:
        device_id:
          type: string
          format: uuid
        authenticated:
          type: boolean
          example: true
    Capabilities:
      type: object
      required: [api_version, supported_events, max_batch_events, max_payload_bytes, max_body_bytes, server_time]
      properties:
        api_version:
          type: string
          example: v1
        supported_events:
          type: array
          items:
            type: string
          example: [system.test.v1, sale.finalized.v3, sale.return_refund.finalized.v1, catalog.category.snapshot.v2, catalog.tag.snapshot.v1, catalog.product.snapshot.v2, catalog.product.sales_policy.snapshot.v1, catalog.product.configuration.snapshot.v1, catalog.product_variant.snapshot.v1, inventory.product_variant.snapshot.v1, catalog.product.media.snapshot.v1]
        max_batch_events:
          type: integer
          example: 100
        max_payload_bytes:
          type: integer
          example: 262144
        max_body_bytes:
          type: integer
          example: 8388608
        server_time:
          type: string
          format: date-time
        store_registration:
          type: boolean
          description: Phase 9A store binding support. Absent/false on older clouds.
        media_upload:
          type: boolean
          description: ADR-0056 content-addressed product image uploads (PUT /api/v1/sync/media/{sha256}).
        max_media_bytes:
          type: integer
          example: 5242880
    MediaUploadResult:
      type: object
      required: [sha256, status]
      properties:
        sha256:
          type: string
        status:
          type: string
          enum: [stored, already_stored]
    SyncBatch:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
          format: uuid
          description: Optional client correlation, echoed back. Never replaces event idempotency.
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncEvent'
    SyncEvent:
      oneOf:
        - $ref: '#/components/schemas/SaleFinalizedV3Event'
        - $ref: '#/components/schemas/ReturnRefundFinalizedV1Event'
        - $ref: '#/components/schemas/CatalogCategorySnapshotV2Event'
        - $ref: '#/components/schemas/CatalogTagSnapshotV1Event'
        - $ref: '#/components/schemas/CatalogProductSnapshotV2Event'
        - $ref: '#/components/schemas/CatalogProductSalesPolicySnapshotV1Event'
        - $ref: '#/components/schemas/CatalogProductConfigurationsSnapshotV1Event'
        - $ref: '#/components/schemas/CatalogProductVariantSnapshotV1Event'
        - $ref: '#/components/schemas/InventoryProductVariantSnapshotV1Event'
        - $ref: '#/components/schemas/SystemTestV1Event'
      discriminator:
        propertyName: event_type
        mapping:
          sale.finalized.v3: '#/components/schemas/SaleFinalizedV3Event'
          sale.return_refund.finalized.v1: '#/components/schemas/ReturnRefundFinalizedV1Event'
          catalog.category.snapshot.v2: '#/components/schemas/CatalogCategorySnapshotV2Event'
          catalog.tag.snapshot.v1: '#/components/schemas/CatalogTagSnapshotV1Event'
          catalog.product.snapshot.v2: '#/components/schemas/CatalogProductSnapshotV2Event'
          catalog.product.sales_policy.snapshot.v1: '#/components/schemas/CatalogProductSalesPolicySnapshotV1Event'
          catalog.product.configuration.snapshot.v1: '#/components/schemas/CatalogProductConfigurationsSnapshotV1Event'
          catalog.product_variant.snapshot.v1: '#/components/schemas/CatalogProductVariantSnapshotV1Event'
          inventory.product_variant.snapshot.v1: '#/components/schemas/InventoryProductVariantSnapshotV1Event'
          system.test.v1: '#/components/schemas/SystemTestV1Event'
    SyncEventEnvelope:
      type: object
      required: [event_id, event_type, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Generated once with the desktop outbox row; never regenerated on retry.
        device_id:
          type: string
          format: uuid
          description: Optional echo; must equal the authenticated device.
        occurred_at:
          type: string
          format: date-time
          description: Business timestamp; bounded (2020-01-01 .. now+24h), never authority.
    SystemTestV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [system.test.v1]
            payload:
              type: object
              description: Diagnostic ping object, max 256 KiB.
    ReturnRefundFinalizedV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [sale.return_refund.finalized.v1]
            payload:
              $ref: '#/components/schemas/ReturnRefundFinalizedV1'
    CatalogCategorySnapshotV2Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [catalog.category.snapshot.v2]
            payload:
              $ref: '#/components/schemas/CatalogCategorySnapshotV2'
    CatalogTagSnapshotV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [catalog.tag.snapshot.v1]
            payload:
              $ref: '#/components/schemas/CatalogTagSnapshotV1'
    CatalogProductSnapshotV2Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [catalog.product.snapshot.v2]
            payload:
              $ref: '#/components/schemas/CatalogProductSnapshotV2'
    CatalogProductVariantSnapshotV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [catalog.product_variant.snapshot.v1]
            payload:
              $ref: '#/components/schemas/CatalogProductVariantSnapshotV1'
    InventoryProductVariantSnapshotV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [inventory.product_variant.snapshot.v1]
            payload:
              $ref: '#/components/schemas/InventoryProductVariantSnapshotV1'
    CatalogProductSalesPolicySnapshotV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [catalog.product.sales_policy.snapshot.v1]
            payload:
              $ref: '#/components/schemas/CatalogProductSalesPolicySnapshotV1'
    CatalogProductConfigurationsSnapshotV1Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [catalog.product.configuration.snapshot.v1]
            payload:
              $ref: '#/components/schemas/CatalogProductConfigurationsSnapshotV1'
    CatalogProductConfigurationsSnapshotV1:
      type: object
      additionalProperties: false
      required: [product_id, configurations, configuration_revision]
      description: >
        Complete ONLINE product-option (frame configuration) state of one
        Product at one aggregate configuration revision (Phase 15). Valid
        combinations are explicit rows — never a Cartesian generation.
        A frame configuration is not a Product: no SKU, no stock. The
        integration-only NO-FRAME sentinel is never a configuration id.
      properties:
        product_id: {type: string, format: uuid}
        configuration_revision: {type: integer, minimum: 1}
        configurations:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/CatalogProductConfigurationEntry'}
    CatalogProductConfigurationEntry:
      type: object
      additionalProperties: false
      required: [configuration_id, kind, style_code, style_name_ar, color_code, color_name_ar, price_delta_egp_cents, enabled, position, configuration_revision]
      properties:
        configuration_id:
          type: string
          format: uuid
          not: {enum: ['00000000-0000-0000-0000-000000000000']}
          description: 'Stable identity; the zero UUID sentinel is rejected — it is integration-only NO-FRAME state.'
        kind: {type: string, enum: [frame]}
        style_code: {type: string, minLength: 1, maxLength: 32}
        style_name_ar: {type: string, minLength: 1, maxLength: 100}
        style_name_en: {type: string, nullable: true, minLength: 1, maxLength: 100}
        color_code: {type: string, minLength: 1, maxLength: 32}
        color_name_ar: {type: string, minLength: 1, maxLength: 100}
        color_name_en: {type: string, nullable: true, minLength: 1, maxLength: 100}
        price_delta_egp_cents: {type: integer, minimum: 0, maximum: 1000000000000, description: 'Exact int64 minor units; never float; never FX.'}
        price_delta_usd_cents: {type: integer, nullable: true, minimum: 0, maximum: 1000000000000, description: 'NULL = the choice is not offered in USD; never inferred from EGP.'}
        enabled: {type: boolean}
        position: {type: integer, minimum: 0}
        configuration_revision: {type: integer, minimum: 1}
    CatalogPrice:
      type: object
      additionalProperties: false
      required: [currency, price_cents]
      properties:
        currency: {type: string, enum: [EGP, USD]}
        price_cents: {type: integer, minimum: 0}
        cost_cents: {type: integer, minimum: 0, nullable: true}
      description: Integer minor units, never float. Cost is optional.
    CatalogCategorySnapshotV2:
      type: object
      additionalProperties: false
      required: [category_id, status, name_ar, parent_ids, catalog_revision, online_enabled]
      properties:
        category_id: {type: string, format: uuid}
        status: {type: string, enum: [active, hidden, archived]}
        name_ar: {type: string, minLength: 1, maxLength: 200}
        name_en: {type: string, minLength: 1, maxLength: 200, nullable: true}
        parent_ids:
          type: array
          items: {type: string, format: uuid}
          description: Complete ordered parent set (snapshot, never delta).
        online_enabled: {type: boolean}
        catalog_revision: {type: integer, minimum: 1}
      description: Authoritative category state with the existing explicit online policy at a monotonic revision.
    CatalogTagSnapshotV1:
      type: object
      additionalProperties: false
      required: [tag_id, slug, is_active, name_ar, catalog_revision]
      properties:
        tag_id: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z0-9-]+$'}
        is_active: {type: boolean}
        name_ar: {type: string, minLength: 1, maxLength: 200}
        name_en: {type: string, minLength: 1, maxLength: 200, nullable: true}
        catalog_revision: {type: integer, minimum: 1}
      description: Authoritative tag state at a monotonic revision.
    CatalogProductSnapshotV2:
      type: object
      additionalProperties: false
      required: [product_id, name_ar, prices, top_category_id, subcategory_ids, tag_ids, is_active, catalog_revision]
      description: >
        Product aggregate at catalog_revision (Phase 17-R0). The payload
        carries NO SKU-bearing field at all: Product has no SKU authority
        anywhere (ADR-0049); ProductVariant owns SKU/stock and product
        stock is derived only. Compatibility note:
        for one release Cloud's decoder tolerates-and-ignores the retired
        `primary_variant_sku` display mirror (Retail may still emit it
        until both trees ship together); the value is never validated,
        stored, or projected and the next release may reject it like `sku`.
      properties:
        product_id: {type: string, format: uuid}
        name_ar: {type: string, minLength: 1, maxLength: 200}
        name_en: {type: string, minLength: 1, maxLength: 200, nullable: true}
        description_ar: {type: string, nullable: true}
        description_en: {type: string, nullable: true}
        prices:
          type: array
          items: {$ref: '#/components/schemas/CatalogPrice'}
        top_category_id: {type: string, format: uuid}
        subcategory_ids:
          type: array
          items: {type: string, format: uuid}
          description: Complete ordered set; Cloud replaces transactionally.
        tag_ids:
          type: array
          items: {type: string, format: uuid}
          description: Complete ordered set; Cloud replaces transactionally.
        width_cm: {type: integer, minimum: 1, nullable: true}
        height_cm: {type: integer, minimum: 1, nullable: true}
        is_active: {type: boolean}
        catalog_revision: {type: integer, minimum: 1}
    CatalogProductVariantSnapshotV1:
      type: object
      additionalProperties: false
      required: [variant_id, product_id, sku, is_active, variant_revision, catalog_revision]
      description: >
        Authoritative ProductVariant state at variant_revision (Phase 17):
        the physical sellable unit (SKU + stock + attribute combination).
        Money is int64 minor units. Variants are tombstoned (`deleted`),
        never hard-deleted. `stock_quantity`/`inventory_revision` are
        non-semantic mirrors of the inventory stream (shape-checked only).
      properties:
        variant_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        sku: {type: string, minLength: 1, maxLength: 64, pattern: '^[^\r\n\t]{1,64}$'}
        is_active: {type: boolean}
        deleted: {type: boolean, default: false, description: Tombstone marker; the row is never deleted.}
        prices:
          type: array
          maxItems: 2
          description: Per-currency Variant overrides of the Product price and cost; null inherits. Currencies are unique.
          items: {$ref: '#/components/schemas/CatalogProductVariantPrice'}
        stock_quantity: {type: integer, minimum: 0, maximum: 2147483647}
        inventory_revision: {type: integer, minimum: 1}
        variant_revision: {type: integer, minimum: 1}
        position: {type: integer, minimum: 0}
        combination_key: {type: string, maxLength: 512, pattern: '^[^\r\n\t]{0,512}$'}
        attributes:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/CatalogProductVariantAttribute'}
        catalog_revision: {type: integer, minimum: 1}
    CatalogProductVariantPrice:
      type: object
      additionalProperties: false
      required: [currency, price_cents, cost_cents]
      properties:
        currency: {type: string, enum: [EGP, USD]}
        price_cents: {type: integer, format: int64, minimum: 0, nullable: true}
        cost_cents: {type: integer, format: int64, minimum: 0, nullable: true}
    CatalogProductVariantAttribute:
      type: object
      additionalProperties: false
      required: [definition_code, value_code, name_ar, definition_name_ar, position]
      description: One physical option of a variant. Identity is (definition_code, value_code); labels are projection-only.
      properties:
        definition_code: {type: string, minLength: 1, maxLength: 64, pattern: '^[^\r\n\t]{1,64}$'}
        value_code: {type: string, minLength: 1, maxLength: 64, pattern: '^[^\r\n\t]{1,64}$'}
        name_ar: {type: string, minLength: 1, maxLength: 200}
        name_en: {type: string, maxLength: 200, nullable: true}
        definition_name_ar: {type: string, minLength: 1, maxLength: 200}
        definition_name_en: {type: string, maxLength: 200, nullable: true}
        position: {type: integer, minimum: 0}
    InventoryProductVariantSnapshotV1:
      type: object
      additionalProperties: false
      required: [variant_id, product_id, inventory_revision, stock_quantity]
      description: Authoritative per-variant stock at an independent monotonic inventory revision (Phase 17). Current state, never a delta.
      properties:
        variant_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        sku: {type: string, maxLength: 64, description: Shape-validated mirror; not semantic on this stream.}
        stock_quantity: {type: integer, minimum: 0, maximum: 2147483647}
        inventory_revision: {type: integer, minimum: 1}
        ready: {type: boolean}
        sell_online: {type: boolean}
        online_allocation_limit: {type: integer, minimum: 0, maximum: 2147483647, nullable: true}
        policy_revision: {type: integer, minimum: 0}
        catalog_revision: {type: integer, minimum: 0}
    CatalogProductSalesPolicySnapshotV1:
      type: object
      additionalProperties: false
      required: [product_id, sales_policy_revision, sell_offline, sell_online]
      properties:
        product_id: {type: string, format: uuid}
        sales_policy_revision: {type: integer, minimum: 1}
        sell_offline: {type: boolean}
        sell_online: {type: boolean}
        online_allocation_limit: {type: integer, minimum: 0, maximum: 2147483647, nullable: true}
      description: Authoritative per-product sales-channel configuration at an independent monotonic revision. Allocation cap only, never stock or availability.
    BatchResult:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            type: object
            required: [event_id, status]
            properties:
              event_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [accepted, already_accepted]
    DeviceControlCommand:
      type: object
      description: Durable sync_now.v1 command. Only command_type sync_now and command_version 1 exist.
      required: [id, type, version, lease_generation, requested_at, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [sync_now]
        version:
          type: integer
          enum: [1]
        lease_generation:
          type: integer
          minimum: 0
          description: Increments on every poll lease; diagnostics only.
        requested_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, leased, accepted, running, completed, failed]
        accepted_at:
          type: string
          format: date-time
          nullable: true
        running_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result_code:
          type: string
          nullable: true
          enum: [SYNC_COMPLETED, SYNC_FAILED_NETWORK, SYNC_FAILED_AUTH, SYNC_FAILED_CONFLICT, SYNC_FAILED_INTERNAL]
    DeviceControlPollResponse:
      type: object
      description: Poll is bodyless; the response carries server time and at most one leased command.
      required: [server_time]
      properties:
        server_time:
          type: string
          format: date-time
          description: Cloud server time; Retail clocks are never trusted.
        command:
          $ref: '#/components/schemas/DeviceControlCommand'
    DeviceControlCommandResponse:
      type: object
      required: [command]
      properties:
        command:
          $ref: '#/components/schemas/DeviceControlCommand'
    DeviceControlStatusReport:
      type: object
      description: Retail status report. Terminal reports require the matching result code.
      required: [status]
      properties:
        status:
          type: string
          enum: [running, completed, failed]
        result_code:
          type: string
          description: Required for completed/failed; must match the status.
          enum: [SYNC_COMPLETED, SYNC_FAILED_NETWORK, SYNC_FAILED_AUTH, SYNC_FAILED_CONFLICT, SYNC_FAILED_INTERNAL]
    CatalogAdminCommandList:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CatalogAdminCommand'
        next_cursor:
          type: string
          description: Opaque keyset cursor for the next page. Empty means end of history.
    CatalogAdminCreateRequest:
      type: object
      required: [store_id, type, entity_id, expected_revision, payload]
      properties:
        store_id:
          type: string
          format: uuid
          description: Authoritative Store scope. Never global.
        type:
          type: string
          enum: [catalog.product.details.update.v1, catalog.product.online-policy.update.v1, catalog.product.classification.update.v1, catalog.category.details.update.v1, catalog.category.parents.update.v1, catalog.category.online-policy.update.v1, catalog.tag.details.update.v1, catalog.product.variants.update.v1, catalog.product.variant.update.v1, catalog.variant.attributes.update.v1, catalog.product-type.create.v1, catalog.product-type.details.update.v1, catalog.product-type.dimensions.update.v1, catalog.product-type.capabilities.update.v1, catalog.product-type.status.update.v1, catalog.product.type.assign.v1]
          description: Immutable versioned command type. No generic patch exists.
        entity_id:
          type: string
          description: 'Target business entity UUID for entity commands. MUST be "" (absent marker) for catalog.product-type.create.v1 — Cloud fabricates no ProductType identity; Retail mints the canonical ID and returns it as result_entity_id. Immutable, never edited by the command.'
        expected_revision:
          type: integer
          minimum: 0
          description: Expected authoritative Retail revision. Stale values conflict with zero writes.
        payload:
          type: object
          description: Typed command fields. SKU, stock, Sales and Returns are never writable here.
        mfa_code:
          type: string
          description: >-
            Fresh authenticator (TOTP) code approving a product, price or
            catalog change (every type except the two online-policy types).
            Checked and consumed before the command is created; never stored.
            Recovery codes are not accepted.
    CatalogAdminPermissions:
      type: object
      required: [online_selling, products, catalog, devices]
      description: >-
        What the shop lets Cloud change, as advertised by the Store's active,
        bound, command-capable devices (a scope is allowed when any of them
        allows it). Retail checks every command again on arrival.
      properties:
        online_selling:
          type: boolean
          description: Product and Category online-policy commands.
        products:
          type: boolean
          description: Product details (names, prices, cost) and Variant commands.
        catalog:
          type: boolean
          description: Classification, Category, Tag and ProductType commands.
        devices:
          type: integer
          minimum: 0
          description: Active bound devices that can apply commands.
    CatalogAdminCommand:
      type: object
      required: [id, store_id, type, version, entity_id, target_kind, payload_hash, expected_revision, actor, status, aggregate, converged, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        type:
          type: string
        version:
          type: integer
        entity_id:
          type: string
          description: 'Business entity UUID for entity commands. Explicit absent marker "" for create-kind commands (never a placeholder UUID).'
        target_kind:
          type: string
          enum: [entity, create]
          description: 'entity = addresses a pre-existing business entity; create = creation intent (Retail mints the canonical ID at apply).'
        requested_key:
          type: string
          description: 'Stable requested key for creates (ProductType code). Absent for entity commands.'
        result_entity_id:
          type: string
          format: uuid
          description: 'Actual Retail-minted entity ID once a target reports APPLIED (first writer wins). Intent rows are never rewritten.'
        payload:
          type: object
          description: Immutable command payload. Included only on detail requests with ?payload=1.
        payload_hash:
          type: string
          description: Deterministic SHA-256 over canonical JSON. Same ID plus different payload is rejected.
        expected_revision:
          type: integer
        actor:
          type: string
          description: Authenticated operator identity, derived server-side. Never client-supplied.
        status:
          type: string
          enum: [pending, cancelled]
        aggregate:
          type: string
          enum: [pending, delivered, applied, converged, partial, conflict, blocked_capability, cancelled]
          description: Store-level state across targets. Creation is never reported as success; CONVERGED requires the projection to reach the resulting revision.
        converged:
          type: boolean
        targets:
          type: array
          items:
            $ref: '#/components/schemas/CatalogAdminTarget'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CatalogAdminTarget:
      type: object
      required: [id, command_id, device_id, status]
      properties:
        id:
          type: string
          format: uuid
        command_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        status:
          type: string
          enum: [pending, delivered, applied, conflict, rejected, blocked_capability, skipped_revoked, cancelled]
        result_code:
          type: string
          description: Bounded machine code (APPLIED, REVISION_CONFLICT, VALIDATION_FAILED, ENTITY_NOT_FOUND, STORE_SCOPE_CONFLICT, UNSUPPORTED_COMMAND, COMMAND_ID_PAYLOAD_MISMATCH, DEPENDENCY_MISSING, RETRYABLE_FAILURE).
        entity_id:
          type: string
          description: 'Per-target entity evidence: the Retail-reported entity for this target (for creates, the minted ID once APPLIED). Never a placeholder.'
        pre_revision:
          type: integer
        post_revision:
          type: integer
        capable:
          type: boolean
          nullable: true
          description: False when the device never announced catalog_admin_commands_v1 (Retail update required).
    DeviceCatalogCommandList:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          items:
            type: object
            required: [target_id, command_id, command_type, version, store_id, payload, payload_hash]
            properties:
              target_id:
                type: string
                format: uuid
              command_id:
                type: string
                format: uuid
              command_type:
                type: string
              version:
                type: integer
              store_id:
                type: string
                format: uuid
              payload:
                type: object
              payload_hash:
                type: string
    DeviceCatalogCommandResult:
      type: object
      required: [status, result_code]
      properties:
        status:
          type: string
          enum: [applied, conflict, rejected]
        result_code:
          type: string
        entity_id:
          type: string
        pre_revision:
          type: integer
        post_revision:
          type: integer
    DeviceCatalogCommandAck:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    DeviceCapabilities:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          maxItems: 16
          items:
            type: string
          description: >-
            Versioned capability strings: catalog_admin_commands_v1 plus one
            catalog_admin_scope_{online_selling,products,catalog}_v1 per shop
            permission that is on. The announcement replaces the previous one;
            unknown names are ignored and scopes count only with
            catalog_admin_commands_v1.
    DeviceCapabilityResult:
      type: object
      required: [catalog_admin_commands_v1]
      properties:
        catalog_admin_commands_v1:
          type: boolean
    CatalogAdminProductList:
      type: object
      required: [products, next_cursor]
      properties:
        products:
          type: array
          items:
            type: object
            required: [product_id, name_ar, is_active, catalog_revision, sell_online, variant_count, derived_stock, configuration_revision, has_pending]
            description: >-
              Phase 17-R0 (ADR-0049): product rows carry NO sku/stock.
              variant_count/derived_stock derive from the product's
              variants (SKU/stock authority lives on ProductVariant).
            properties:
              product_id: {type: string, format: uuid}
              product_type_id: {type: string, format: uuid, description: 'Phase 17-R2 structural type identity (never inferred). Retail mints UUIDv4; a UUIDv5 (Cloud-derived storage key) is rejected (Phase 17-R3 F16).'}
              name_ar: {type: string}
              name_en: {type: string}
              is_active: {type: boolean}
              catalog_revision: {type: integer}
              sell_online: {type: boolean}
              variant_count: {type: integer, format: int64, description: 'Non-tombstoned variant rows.'}
              derived_stock: {type: integer, format: int64, description: 'SUM of active, non-tombstoned variant stock. Derived only; never authoritative.'}
              configuration_revision: {type: integer}
              has_pending: {type: boolean}
              thumbnail_sha256: {type: string, description: 'ADR-0056 list thumbnail: the first stored file of the Product gallery (main image first), else of a Variant gallery; empty when no file has arrived. Read it from /api/v1/dashboard/catalog-admin/media/{sha256}.'}
        next_cursor:
          type: string
          description: Keyset cursor for the next page. Empty on the final page.
    CatalogAdminProductDetail:
      type: object
      required: [product_id, catalog_revision, sales_policy_revision, configuration_revision, variant_count, derived_stock]
      description: >-
        Phase 17-R0 (ADR-0049): the product carries NO sku/stock — SKU and
        stock authority live on the variants below; variant_count/
        derived_stock are derived only.
      properties:
        product_id: {type: string, format: uuid}
        product_type_id: {type: string, format: uuid, description: 'Phase 17-R2 structural type identity (never inferred). Retail mints UUIDv4; a UUIDv5 (Cloud-derived storage key) is rejected (Phase 17-R3 F16).'}
        name_ar: {type: string}
        name_en: {type: string}
        description_ar: {type: string}
        description_en: {type: string}
        width_cm: {type: integer, nullable: true}
        height_cm: {type: integer, nullable: true}
        top_category_id: {type: string, format: uuid}
        subcategory_ids:
          type: array
          items: {type: string, format: uuid}
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        egp_price_minor: {type: string, description: Exact minor units. Never a JSON number.}
        usd_price_minor: {type: string, nullable: true}
        cost_minor: {type: string}
        is_active: {type: boolean}
        sell_online: {type: boolean}
        sell_offline: {type: boolean, description: Display only. Phase16 never changes sell_offline.}
        variant_count: {type: integer, format: int64, description: 'Non-tombstoned variant rows. Derived read model.'}
        derived_stock: {type: integer, format: int64, description: 'SUM of active, non-tombstoned variant stock. Derived only; never authoritative.'}
        catalog_revision: {type: integer}
        sales_policy_revision: {type: integer}
        configuration_revision: {type: integer}
        has_pending: {type: boolean}
        variants:
          type: array
          description: Phase 17 SKU/inventory-owning variants with attributes, prices and stock.
          items:
            $ref: '#/components/schemas/CatalogAdminProductVariant'
        images:
          type: array
          description: ADR-0056 galleries, read-only (edited in Retail). Product gallery entries have an empty variant_id; available is false until Retail uploads the file.
          items:
            $ref: '#/components/schemas/CatalogAdminProductImage'
    CatalogAdminProductImage:
      type: object
      required: [image_id, variant_id, position, is_primary, sha256, width, height, available]
      properties:
        image_id: {type: string, format: uuid}
        variant_id: {type: string, description: Empty for the Product gallery.}
        position: {type: integer}
        is_primary: {type: boolean}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        width: {type: integer}
        height: {type: integer}
        available: {type: boolean}
    CatalogAdminProductVariantList:
      type: object
      required: [variants]
      properties:
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CatalogAdminProductVariant'
    CatalogAdminProductVariant:
      type: object
      required: [variant_id, product_id, sku, is_active, deleted, price_egp_minor, stock_quantity, position, combination_key, variant_revision, catalog_revision, inventory_revision, has_pending, attributes]
      properties:
        variant_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        sku: {type: string, description: Variant SKU identity. Read-only here; Phase 17 commands update it through catalog.product.variant.update.v1.}
        is_active: {type: boolean}
        deleted: {type: boolean, description: Tombstone flag. Deleted variants keep their rows for historical safety.}
        price_egp_minor: {type: string, description: Exact minor units. Never a JSON number.}
        price_usd_minor: {type: string, nullable: true, description: Null means unpriced in USD; zero is an explicit zero price.}
        stock_quantity: {type: integer, format: int64, description: Read-only last-known variant stock.}
        position: {type: integer}
        combination_key: {type: string, description: Normalized stable option identity (entries joined with U+001F).}
        variant_revision: {type: integer, format: int64}
        catalog_revision: {type: integer, format: int64}
        inventory_revision: {type: integer, format: int64}
        has_pending: {type: boolean}
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogAdminProductVariantAttribute'
    CatalogAdminProductVariantAttribute:
      type: object
      required: [definition_code, value_code, name_ar, definition_name_ar, position]
      properties:
        definition_code: {type: string}
        value_code: {type: string}
        name_ar: {type: string}
        name_en: {type: string}
        definition_name_ar: {type: string}
        definition_name_en: {type: string}
        position: {type: integer}
    CatalogAdminConfigurationList:
      type: object
      required: [configurations]
      properties:
        configurations:
          type: array
          items:
            type: object
            required: [id, style_code, style_name_ar, color_code, color_name_ar, egp_delta_minor, enabled, position]
            properties:
              id: {type: string, format: uuid, description: Stable row identity. Edits reuse IDs; new rows omit them.}
              style_code: {type: string}
              style_name_ar: {type: string}
              style_name_en: {type: string, nullable: true}
              color_code: {type: string}
              color_name_ar: {type: string}
              color_name_en: {type: string, nullable: true}
              egp_delta_minor: {type: string, description: "Exact minor units, never negative."}
              usd_delta_minor: {type: string, nullable: true, description: Null means unavailable in USD; zero is an explicit zero delta.}
              enabled: {type: boolean}
              position: {type: integer}
    CatalogAdminCategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [category_id, name_ar, status, online_enabled, parent_ids, catalog_revision, has_pending]
            properties:
              category_id: {type: string, format: uuid}
              name_ar: {type: string}
              name_en: {type: string}
              status: {type: string, enum: [active, hidden, archived]}
              online_enabled: {type: boolean}
              parent_ids:
                type: array
                items: {type: string, format: uuid}
              catalog_revision: {type: integer}
              has_pending: {type: boolean}
    CatalogAdminProductTypeList:
      type: object
      required: [product_types]
      properties:
        product_types:
          type: array
          items:
            $ref: '#/components/schemas/CatalogAdminProductType'
    CatalogAdminProductTypeDetail:
      type: object
      required: [product_type]
      properties:
        product_type:
          $ref: '#/components/schemas/CatalogAdminProductType'
    CatalogAdminProductType:
      type: object
      required: [type_id, code, is_active, position, type_revision, dimensions, capabilities]
      description: >-
        Phase 17-R2 structural type (Retail authority, ADR-0050). Code is
        stable machine identity; labels are display state. Dimensions bound
        variant attributes; capabilities gate optional behaviors
        (frame_configuration).
      properties:
        type_id: {type: string, format: uuid}
        code: {type: string, description: 'Stable machine identity, immutable once created.'}
        name_ar: {type: string}
        name_en: {type: string}
        description_ar: {type: string, nullable: true}
        description_en: {type: string, nullable: true}
        is_active: {type: boolean}
        position: {type: integer}
        type_revision: {type: integer}
        dimensions:
          type: array
          items: {type: string}
        capabilities:
          type: array
          items: {type: string, enum: [frame_configuration]}
        has_pending: {type: boolean}
    CatalogAdminTagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: object
            required: [tag_id, slug, is_active, catalog_revision, has_pending]
            properties:
              tag_id: {type: string, format: uuid}
              slug: {type: string, description: Immutable. Display only.}
              name_ar: {type: string}
              name_en: {type: string}
              is_active: {type: boolean}
              catalog_revision: {type: integer}
              has_pending: {type: boolean}
    DashboardDeviceList:
      type: object
      required: [devices, control_enabled]
      properties:
        control_enabled:
          type: boolean
          description: Whether this Cloud instance exposes authenticated device control. False disables new Sync Now requests, without changing observed connectivity.
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDevice'
    DashboardDevice:
      type: object
      description: Operator device row. Connectivity derives from server-observed last_seen_at; active_command is null unless a non-terminal command exists; recent_commands holds up to 5 newest commands of any state.
      required: [device_id, lifecycle, connectivity, control]
      properties:
        device_id:
          type: string
          format: uuid
        name:
          type: string
        lifecycle:
          type: string
          description: Canonical device lifecycle (active or revoked).
        connectivity:
          type: string
          enum: [never_seen, online, offline]
          description: online means Cloud heard any authenticated request from the Retail app (sync upload or control poll) within the freshness window; never proof of data freshness.
        control:
          type: string
          enum: [polling, poll_stale, never_polled]
          description: Whether the control channel itself polled within the freshness window. An online device that is not polling uploads data but cannot receive Sync Now yet.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        last_poll_at:
          type: string
          format: date-time
          nullable: true
          description: Newest control-channel poll.
        last_data_at:
          type: string
          format: date-time
          nullable: true
          description: Newest sync event received from this device.
        active_command:
          $ref: '#/components/schemas/DeviceControlCommand'
          nullable: true
        recent_commands:
          type: array
          items:
            $ref: '#/components/schemas/DeviceControlCommand'
        store_id:
          type: string
          format: uuid
          description: Bound Store, if any. Absent means unbound/legacy — never fabricated.
        store_name:
          type: string
          description: Bound Store display name, if any.
    DashboardStoreList:
      type: object
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/DashboardStore'
    DashboardStore:
      type: object
      required: [store_id, display_name, timezone, status, device_count, created_at, updated_at]
      properties:
        store_id:
          type: string
          format: uuid
        display_name:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [active, disabled]
        device_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StoreRegistrationRequest:
      type: object
      required: [store_id, display_name, timezone]
      properties:
        store_id:
          type: string
          format: uuid
          description: Retail-owned Store identity. Identity, never a secret; the device credential authorizes.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA identifier (e.g. Africa/Cairo).
    StoreRegistrationResult:
      type: object
      required: [store_id, display_name, timezone]
      properties:
        store_id:
          type: string
          format: uuid
        display_name:
          type: string
        timezone:
          type: string
    DashboardSyncRequestResponse:
      type: object
      required: [command, created]
      properties:
        command:
          $ref: '#/components/schemas/DeviceControlCommand'
        created:
          type: boolean
    OperationsIncident:
      type: object
      description: Durable operational incident. States open/acknowledged/resolved; severities warning/urgent (operator language only).
      required: [id, rule, subject_type, subject_id, severity, state, episode, opened_at, last_observed_at, open_intent_materialized, resolved_intent_materialized]
      properties:
        id:
          type: string
          format: uuid
        rule:
          type: string
          enum: [DEVICE_OFFLINE, DEVICE_SYNC_FAILED, DEVICE_SYNC_STALE, BUSINESS_REPORT_BLOCKED, BUSINESS_REPORT_STALE, NOTIFICATION_BLOCKED, NOTIFICATION_AMBIGUOUS, NOTIFICATION_RETRY_STALE]
        subject_type:
          type: string
          enum: [device, sync_command, report_run, notification]
        subject_id:
          type: string
        severity:
          type: string
          enum: [warning, urgent]
        state:
          type: string
          enum: [open, acknowledged, resolved]
        episode:
          type: integer
          minimum: 1
        opened_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_code:
          type: string
          nullable: true
          enum: [RECONNECT_RESOLVED, DEVICE_NO_LONGER_ACTIVE, CONDITION_CLEARED, TERMINAL_REACHED, OPERATOR_RESOLVED]
        open_intent_materialized:
          type: boolean
          description: True when the opened alert intent is durably materialized; false marks a pre-atomic legacy row needing explicit operator reconcile.
        resolved_intent_materialized:
          type: boolean
          description: True when the resolved alert intent is durably materialized; false marks a pre-atomic legacy row needing explicit operator reconcile.
    OperationsIncidentList:
      type: object
      required: [incidents, next_cursor]
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/OperationsIncident'
        next_cursor:
          type: string
    OperationsIncidentDetail:
      type: object
      required: [incident, deliveries, recoveries]
      properties:
        incident:
          $ref: '#/components/schemas/OperationsIncident'
        deliveries:
          type: array
          items:
            type: object
            required: [id, event, provider_key, recipient_masked, locale, template_key, status, has_notification]
            properties:
              id:
                type: string
                format: uuid
              event:
                type: string
                enum: [opened, resolved]
              provider_key:
                type: string
              recipient_masked:
                type: string
                description: Last four characters only; full addresses never leave the database.
              locale:
                type: string
                enum: [ar, en]
              template_key:
                type: string
              status:
                type: string
                enum: [pending, sent, blocked]
              has_notification:
                type: boolean
        recoveries:
          type: array
          items:
            type: object
            required: [id, action_type, state, attempt_count]
            properties:
              id:
                type: string
                format: uuid
              action_type:
                type: string
                enum: [DEVICE_RECONNECT_SYNC]
              state:
                type: string
                enum: [pending, completed, blocked]
              target_entity_id:
                type: string
              result_code:
                type: string
              attempt_count:
                type: integer
    OperationsIncidentResponse:
      type: object
      required: [incident]
      properties:
        incident:
          $ref: '#/components/schemas/OperationsIncident'
    DashboardStoreCreated:
      type: object
      required: [store_id, display_name, timezone, status, device_count, created_at, updated_at]
      properties:
        store_id: {type: string, format: uuid}
        display_name: {type: string}
        timezone: {type: string}
        status: {type: string, enum: [active, disabled]}
        device_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DeviceCredentialIssued:
      type: object
      required: [device_id, credential_id, name, store_id, credential]
      properties:
        device_id: {type: string, format: uuid}
        credential_id: {type: string, format: uuid}
        name: {type: string}
        store_id: {type: string, format: uuid}
        credential:
          type: string
          readOnly: true
          description: One-time ready-to-paste device_id.credential_id.secret. Never logged or returned by list/read routes.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: invalid device credential
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          description: Integer minor units only, never negative. Floats are rejected. Stricter per-field minimums (e.g. positive payment amounts) live in runtime validation.
          example: 1250
        currency:
          type: string
          enum: [EGP, USD]
    FxSnapshot:
      type: object
      required: [base, quote, rate, rate_microrate]
      properties:
        base:
          type: string
          example: USD
        quote:
          type: string
          example: EGP
        rate:
          type: string
          description: Exact decimal string; rate_microrate must equal rate × 1000000.
          example: "52.000000"
        rate_microrate:
          type: integer
          format: int64
          example: 52000000
      description: Required for USD sales with the exact USD→EGP pair; absent for EGP sales.
    ShopSnapshot:
      type: object
      required: [name_ar]
      properties:
        name_ar: {type: string, minLength: 1, maxLength: 120, pattern: '^.*\S.*$'}
        name_en: {type: string, maxLength: 120}
        address_ar: {type: string, maxLength: 300}
        address_en: {type: string, maxLength: 300}
        phone: {type: string, maxLength: 50}
        receipt_footer_ar: {type: string, maxLength: 500}
        receipt_footer_en: {type: string, maxLength: 500}
      description: >-
        Historical shop identity. Only name_ar is required (Arabic-first
        shops may leave English name and phone empty); rune caps mirror the
        Retail shop-profile contract. name_ar must contain at least one
        non-whitespace character, matching runtime TrimSpace semantics.
    ActorSnapshot:
      type: object
      properties:
        cashier_id: {type: string, nullable: true}
        cashier_name: {type: string, nullable: true}
      description: >-
        Cashier snapshot; local operational identity only. Runtime preserves
        whatever non-empty producer value arrives (fixtures use stable test
        IDs); no PIN/password data exists by contract.
    ClassificationSnapshot:
      type: object
      required: [category_id, name_ar, name_en]
      properties:
        category_id: {type: string, format: uuid}
        name_ar: {type: string}
        name_en: {type: string}
    LineClassifications:
      type: object
      required: [roots, subcategories]
      properties:
        roots:
          type: array
          minItems: 1
          maxItems: 1
          items: {$ref: '#/components/schemas/ClassificationSnapshot'}
          description: Exactly one root per line (Retail parity).
        subcategories:
          type: array
          items: {$ref: '#/components/schemas/ClassificationSnapshot'}
    EventPayment:
      type: object
      required: [method, amount, change_given]
      properties:
        method: {type: string, enum: [cash, card]}
        amount: {$ref: '#/components/schemas/Money'}
        change_given: {$ref: '#/components/schemas/Money'}
        transaction_ref: {type: string, nullable: true}
      description: Aggregate SUM(amount) must equal the sale total within ±1 minor unit (change ignored).
    SaleTotals:
      type: object
      required: [subtotal, discount, tax, total]
      properties:
        subtotal: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        total: {$ref: '#/components/schemas/Money'}
    SaleLineTag:
      type: object
      required: [tag_id, slug, name_ar, name_en]
      properties:
        tag_id: {type: string, format: uuid}
        slug: {type: string, minLength: 1, maxLength: 64}
        name_ar: {type: string, minLength: 1}
        name_en: {type: string, minLength: 1}
      description: >-
        Frozen sale-time tag snapshot. Historical identity only; never
        resolved against current catalog tags.
    SaleFinalizedV3Event:
      allOf:
        - $ref: '#/components/schemas/SyncEventEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type:
              type: string
              enum: [sale.finalized.v3]
            payload:
              $ref: '#/components/schemas/SaleFinalizedV3'
    SaleLineVariantAttribute:
      type: object
      additionalProperties: false
      required: [definition_code, value_code, name_ar, definition_name_ar]
      properties:
        definition_code: {type: string, minLength: 1, maxLength: 64, pattern: '^[^\r\n\t]{1,64}$'}
        value_code: {type: string, minLength: 1, maxLength: 64, pattern: '^[^\r\n\t]{1,64}$'}
        name_ar: {type: string, minLength: 1, maxLength: 200}
        name_en: {type: string, maxLength: 200, nullable: true}
        definition_name_ar: {type: string, minLength: 1, maxLength: 200}
        definition_name_en: {type: string, maxLength: 200, nullable: true}
      description: >-
        One frozen sale-time option attribute of the purchased variant.
        Identity is (definition_code, value_code); the bilingual labels
        are display history frozen AT SALE TIME — later catalog label
        renames never rewrite them.
    SaleLineV3:
      type: object
      required: [sale_item_id, sku, product_name, quantity, unit_price, line_total, classifications, tags]
      properties:
        sale_item_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid, nullable: true}
        variant_id: {type: string, format: uuid, nullable: true}
        sku: {type: string}
        product_name: {type: string}
        width_cm: {type: integer, nullable: true}
        height_cm: {type: integer, nullable: true}
        quantity: {type: integer, minimum: 1, maximum: 2147483647}
        unit_price: {$ref: '#/components/schemas/Money'}
        cost: {$ref: '#/components/schemas/Money'}
        line_total: {$ref: '#/components/schemas/Money'}
        classifications: {$ref: '#/components/schemas/LineClassifications'}
        tags:
          type: array
          items: {$ref: '#/components/schemas/SaleLineTag'}
          description: >-
            Always present; empty means capture occurred with zero tags.
            Sorted by tag_id.
        variant_sku:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[^\r\n\t]{1,64}$'
          description: >-
            Frozen variant SKU snapshot. Present together with variant_id
            and variant_attributes (all-or-nothing snapshot); absent for
            lines without variant data.
        variant_attributes:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/SaleLineVariantAttribute'}
          description: >-
            Frozen sale-time option attributes (≤ 32, unique
            definition_code). Present together with variant_id and
            variant_sku; absent for lines without variant data.
        variant_price_egp_cents: {type: integer, format: int64, minimum: 0, nullable: true, description: Nullable sale-time variant pricing override (minor units).}
        variant_price_usd_cents: {type: integer, format: int64, minimum: 0, nullable: true, description: Nullable sale-time variant pricing override (minor units).}
        product_type_id: {type: string, format: uuid, nullable: true}
        product_type_code: {type: string, minLength: 1, maxLength: 32, pattern: '^[^\r\n\t]{1,32}$', nullable: true}
        product_type_name_ar: {type: string, minLength: 1, maxLength: 200, nullable: true}
        product_type_name_en: {type: string, minLength: 1, maxLength: 200, nullable: true}
      description: >-
        ProductType identity, code and both labels are an all-or-nothing
        frozen sale-time snapshot. They remain absent for history without
        Type capture. Type codes contain 1..32 characters; generic Variant
        attribute codes retain their separate 1..64 bound.
    SaleFinalizedV3:
      type: object
      required: [sale_id, sale_number, channel, occurred_at, paid_at, shop, actor, currency, totals, lines, payments]
      properties:
        sale_id: {type: string, format: uuid}
        sale_number: {type: string}
        channel: {type: string, enum: [STORE]}
        occurred_at: {type: string, format: date-time}
        paid_at: {type: string, format: date-time}
        shop: {$ref: '#/components/schemas/ShopSnapshot'}
        actor: {$ref: '#/components/schemas/ActorSnapshot'}
        currency: {type: string, enum: [EGP, USD]}
        fx:
          $ref: '#/components/schemas/FxSnapshot'
        totals: {$ref: '#/components/schemas/SaleTotals'}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SaleLineV3'}
        payments:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventPayment'}
      description: >-
        sale.finalized.v3 (Phase 17-R0) — the v2 shape plus per-line
        frozen ProductVariant snapshots (variant_sku, sale-time option
        attribute labels, nullable sale-time variant pricing override).
        Snapshots are sourced ONLY from this event: Cloud never joins
        current catalog state into stored history. It is the only accepted
        sale version (ADR-0055).
    ReturnActorSnapshot:
      type: object
      properties:
        user_id: {type: string, format: uuid, nullable: true}
        user_name: {type: string, minLength: 1, nullable: true}
      description: Handling-user snapshot; local operational identity only.
    ReturnRefundTotals:
      type: object
      required: [gross, discount, tax, refund_total]
      properties:
        gross: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        refund_total: {$ref: '#/components/schemas/Money'}
      description: >-
        Header breakdowns are exact sums of the per-line values;
        refund_total is the authoritative refund amount.
    ReturnRefundLine:
      type: object
      required: [original_sale_line_id, quantity, restocked, gross, discount, tax, refund]
      properties:
        original_sale_line_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid, nullable: true}
        quantity: {type: integer, minimum: 1, maximum: 2147483647}
        restocked: {type: boolean}
        gross: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        refund: {$ref: '#/components/schemas/Money'}
        cost: {$ref: '#/components/schemas/Money'}
      description: >-
        One returned line linked to its original sale line. ProductID is a
        join hint, not a catalog read. cost is the historical extended cost
        for this returned quantity, in minor units — already historical unit
        cost × returned quantity; consumers must not multiply by quantity
        again.
    ReturnRefundPayment:
      type: object
      required: [method, amount]
      properties:
        method: {type: string, enum: [cash, card, other]}
        amount:
          type: object
          required: [amount_minor, currency]
          properties:
            amount_minor: {type: integer, format: int64, minimum: 1}
            currency: {type: string, enum: [EGP, USD]}
          description: Refund payments are always positive.
        transaction_ref: {type: string, nullable: true}
      description: Refunds pay out exactly; payments sum to refund_total with no tolerance.
    ReturnRefundFinalizedV1:
      type: object
      required: [return_refund_id, return_number, kind, reason, sale_id, sale_number, channel, occurred_at, shop, actor, currency, totals, lines, refunds]
      properties:
        return_refund_id: {type: string, format: uuid}
        return_number: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, enum: [return, void]}
        reason:
          type: string
          enum: [customer_changed_mind, damaged_item, wrong_item, cashier_mistake, duplicate_sale, wrong_products, wrong_payment, other]
        note: {type: string, maxLength: 500, nullable: true}
        sale_id: {type: string, format: uuid}
        sale_number: {type: string, minLength: 1, maxLength: 64}
        sale_event_id: {type: string, format: uuid, nullable: true}
        channel: {type: string, enum: [STORE]}
        occurred_at: {type: string, format: date-time}
        shop: {$ref: '#/components/schemas/ShopSnapshot'}
        actor: {$ref: '#/components/schemas/ReturnActorSnapshot'}
        currency: {type: string, enum: [EGP, USD]}
        fx:
          $ref: '#/components/schemas/FxSnapshot'
        totals: {$ref: '#/components/schemas/ReturnRefundTotals'}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReturnRefundLine'}
        refunds:
          type: array
          items: {$ref: '#/components/schemas/ReturnRefundPayment'}
      description: >-
        sale.return_refund.finalized.v1 — one immutable event per finalized
        Retail return/refund transaction. Original Sale and Sale-line linkage
        is authoritative for Phase 4B joins; historical product/category/cost
        context comes from the original Sale projection, not this event.
        Integer money throughout; no v2 fields exist.
    CurrencyTotal:
      type: object
      required: [currency, subtotal_minor, discount_minor, tax_minor, sales_total_minor, line_cost_minor, refund_total_minor, net_sales_minor, returned_units, returned_cost_minor, net_cost_minor]
      properties:
        currency: {type: string, example: EGP}
        subtotal_minor: {type: integer, example: 100000}
        discount_minor: {type: integer, example: 5000}
        tax_minor: {type: integer, example: 14000}
        sales_total_minor:
          type: integer
          example: 109000
          description: Gross finalized sales. Never reduced by returns; net is a separate field.
        line_cost_minor:
          type: integer
          description: Historical line cost snapshot sum; not a profit basis.
        refund_total_minor:
          type: integer
          description: Authoritative return reversals in period (nonnegative).
        net_sales_minor:
          type: integer
          description: Gross minus refunds. Signed — negative when refunds exceed sales; never clamped.
        returned_units:
          type: integer
          description: Returned unit count in period (nonnegative).
        returned_cost_minor:
          type: integer
          description: Extended historical return-line cost sum (nonnegative).
        net_cost_minor:
          type: integer
          description: Gross cost minus returned cost. Signed; never clamped.
      description: One currency bucket. EGP and USD are never summed. Signed net fields never reuse the nonnegative intake Money schema.
    PaymentTotal:
      type: object
      required: [method, currency, amount_minor, change_minor]
      properties:
        method: {type: string, enum: [cash, card]}
        currency: {type: string, example: EGP}
        amount_minor: {type: integer}
        change_minor: {type: integer}
      description: Tender by method; secondary to finalized Sale totals.
    PeriodMeta:
      type: object
      required: [kind, timezone, start_local, end_local_exclusive, start_utc, end_utc]
      properties:
        kind: {type: string, example: last_10_completed_days}
        timezone: {type: string, example: Africa/Cairo}
        start_local: {type: string, example: '2026-09-12T00:00:00+03:00'}
        end_local_exclusive: {type: string, example: '2026-09-22T00:00:00+03:00'}
        start_utc: {type: string, example: '2026-09-11T21:00:00Z'}
        end_utc: {type: string, example: '2026-09-21T21:00:00Z'}
    Freshness:
      type: object
      required: [projection_backlog_count, blocked_sale_event_count, cloud_projection_complete, return_backlog_count, return_blocked_count, return_projection_complete]
      properties:
        latest_sale_event_received_at: {type: string, format: date-time, nullable: true}
        latest_projected_sale_occurred_at: {type: string, format: date-time, nullable: true}
        projection_backlog_count: {type: integer}
        blocked_sale_event_count: {type: integer}
        cloud_projection_complete:
          type: boolean
          description: All accepted sale events terminal (processed/blocked), no backlog. Sale-scoped only; does NOT mean Retail is fully synchronized.
        latest_return_event_received_at: {type: string, format: date-time, nullable: true}
        latest_projected_return_occurred_at: {type: string, format: date-time, nullable: true}
        return_backlog_count: {type: integer}
        return_blocked_count: {type: integer}
        return_projection_complete:
          type: boolean
          description: All accepted return events terminal (processed/blocked), no backlog.
    SalesSummary:
      type: object
      required: [generated_at, timezone, period, transaction_count, units_sold, return_transaction_count, units_returned, currency_totals, payment_totals, freshness]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
        transaction_count: {type: integer, description: Finalized sale transactions only; returns counted separately.}
        units_sold: {type: integer}
        return_transaction_count: {type: integer, description: Return/refund transactions in period.}
        units_returned: {type: integer, description: Returned units in period.}
        currency_totals:
          type: array
          items: {$ref: '#/components/schemas/CurrencyTotal'}
        payment_totals:
          type: array
          items: {$ref: '#/components/schemas/PaymentTotal'}
        freshness: {$ref: '#/components/schemas/Freshness'}
    DailyRow:
      type: object
      required: [date, transactions, units, return_transactions, units_returned, currency_totals]
      properties:
        date: {type: string, example: '2026-09-22', description: Store-local calendar date.}
        transactions: {type: integer, description: Finalized sale transactions; returns counted separately.}
        units: {type: integer}
        return_transactions: {type: integer}
        units_returned: {type: integer}
        currency_totals:
          type: array
          items: {$ref: '#/components/schemas/CurrencyTotal'}
    SalesDaily:
      type: object
      required: [generated_at, timezone, period, days, freshness]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
        days:
          type: array
          items: {$ref: '#/components/schemas/DailyRow'}
          description: Ascending store-local dates.
        freshness: {$ref: '#/components/schemas/Freshness'}
    LineSaleTotal:
      type: object
      additionalProperties: false
      required: [currency, line_sales_minor, line_cost_minor, line_refund_minor, line_returned_cost_minor]
      properties:
        currency: {type: string}
        line_sales_minor:
          type: integer
          description: Pre-adjustment line snapshot total; Sale-level discount/tax never allocated.
        line_cost_minor:
          type: integer
          description: Extended historical cost (unit cost × quantity); snapshot sum, not a profit basis.
        line_refund_minor:
          type: integer
          description: Reversed line amount for the same attribution; net is derivable. Signed, never clamped.
        line_returned_cost_minor:
          type: integer
          description: Extended historical return-line cost (already unit × returned quantity); never re-multiplied.
    SaleCurrencyTotal:
      type: object
      additionalProperties: false
      required: [currency, subtotal_minor, discount_minor, tax_minor, sales_total_minor, refund_total_minor, net_sales_minor]
      properties:
        currency: {type: string}
        subtotal_minor: {type: integer}
        discount_minor: {type: integer}
        tax_minor: {type: integer}
        sales_total_minor:
          type: integer
          description: Gross finalized sales. Never reduced by returns; net is a separate field.
        refund_total_minor:
          type: integer
          description: Return reversals attributed to this header row (original sale cashier/channel).
        net_sales_minor:
          type: integer
          description: Gross minus refunds. Signed; never clamped.
      description: >-
        Sale-header currency bucket for cashier/channel rows. No cost field
        by design: header dimensions do not compute historical cost.
    LineBreakdownRow:
      type: object
      additionalProperties: false
      required: [dimension, units, units_returned, line_sales]
      description: >-
        Line-level dimension row (product, product_type, root_category, subcategory, tag).
        line_sales carries pre-adjustment historical line amounts plus
        reversal amounts; Sale-level discount/tax are never allocated.
        Never carries currency_totals.
      properties:
        dimension: {type: string, enum: [product, product_type, root_category, subcategory, tag]}
        product_id: {type: string, format: uuid, nullable: true}
        sku: {type: string, nullable: true}
        product_name: {type: string, nullable: true}
        product_type_id: {type: string, format: uuid, nullable: true}
        product_type_code: {type: string, nullable: true}
        product_type_name_ar: {type: string, nullable: true}
        product_type_name_en: {type: string, nullable: true}
        classification_kind: {type: string, enum: [root, subcategory]}
        classification_id: {type: string, format: uuid}
        tag_id: {type: string, format: uuid}
        tag_slug: {type: string}
        name_ar: {type: string}
        name_en: {type: string}
        units: {type: integer}
        units_returned: {type: integer}
        line_sales:
          type: array
          items: {$ref: '#/components/schemas/LineSaleTotal'}
          description: Subcategory rows are facet-style and may sum above the line total.
    HeaderBreakdownRow:
      type: object
      additionalProperties: false
      required: [dimension, transactions, return_transactions, units, units_returned, currency_totals]
      description: >-
        Sale-header dimension row (cashier, channel). currency_totals
        carries exact header subtotal/discount/tax/sales_total plus
        refund/net fields. transactions stays sale-only; returns ride in
        return_transactions. Never carries line_sales or any cost field.
      properties:
        dimension: {type: string, enum: [cashier, channel]}
        cashier_id: {type: string, nullable: true, description: Null means unattributed bucket.}
        cashier_name: {type: string, nullable: true}
        channel: {type: string}
        transactions: {type: integer, description: Finalized sale transactions; returns counted separately.}
        return_transactions: {type: integer}
        units: {type: integer}
        units_returned: {type: integer}
        currency_totals:
          type: array
          items: {$ref: '#/components/schemas/SaleCurrencyTotal'}
    BreakdownRow:
      oneOf:
        - $ref: '#/components/schemas/LineBreakdownRow'
        - $ref: '#/components/schemas/HeaderBreakdownRow'
      description: >-
        One dimension value, structurally split by family. Consumers must
        not infer shape from dimension names alone: validate against the
        oneOf branches.
    SalesBreakdown:
      type: object
      required: [generated_at, timezone, period, dimension, rows, freshness]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        dimension: {type: string, enum: [product, product_type, root_category, subcategory, cashier, channel]}
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
        rows:
          type: array
          items: {$ref: '#/components/schemas/BreakdownRow'}
          description: Units descending, deterministic identity tie-break.
        freshness: {$ref: '#/components/schemas/Freshness'}
    DashboardNormalized:
      type: object
      required: [normalized_total_minor, normalized_refund_minor, normalized_net_minor, transactions, units, return_transactions, units_returned, usd_sale_count]
      properties:
        normalized_total_minor:
          type: string
          description: Exact EGP minor units (string, never float). Native EGP plus each USD sale converted with its own historical FX microrate (PostgreSQL numeric rounding, documented).
        normalized_refund_minor:
          type: string
          description: Normalized return reversals, each with its own historical FX. Nonnegative.
        normalized_net_minor:
          type: string
          description: Gross minus refunds. Signed string; negative when refunds exceed sales; never clamped.
        transactions: {type: integer, description: Finalized sale transactions; returns counted separately.}
        units: {type: integer}
        return_transactions: {type: integer}
        units_returned: {type: integer}
        usd_sale_count: {type: integer}
    DashboardFx:
      type: object
      required: [has_usd, multiple_rates_used]
      properties:
        has_usd: {type: boolean}
        latest_rate: {type: string, description: Exact decimal string of the latest historical USD sale rate. Never a live market rate.}
        latest_rate_microrate: {type: string}
        latest_occurred_at: {type: string, format: date-time}
        min_rate_microrate: {type: string}
        max_rate_microrate: {type: string}
        multiple_rates_used: {type: boolean}
    DashboardSummaryBucket:
      type: object
      required: [currency, subtotal_minor, discount_minor, tax_minor, sales_total_minor, line_cost_minor, refund_total_minor, net_sales_minor, returned_units, returned_cost_minor, net_cost_minor]
      properties:
        currency: {type: string}
        subtotal_minor: {type: string}
        discount_minor: {type: string}
        tax_minor: {type: string}
        sales_total_minor: {type: string, description: "Gross finalized sales. Never reduced by returns; net is separate."}
        line_cost_minor: {type: string, description: Extended historical cost (unit cost × quantity).}
        refund_total_minor: {type: string, description: Return reversals. Nonnegative string.}
        net_sales_minor: {type: string, description: Gross minus refunds. Signed string; never clamped.}
        returned_units: {type: integer}
        returned_cost_minor: {type: string, description: Extended historical return-line cost. Nonnegative string.}
        net_cost_minor: {type: string, description: Gross cost minus returned cost. Signed string; never clamped.}
      description: String-backed money (never JSON numbers). Same numbers as Phase 3A, decimal-string encoding.
    DashboardSummaryPayment:
      type: object
      required: [method, currency, amount_minor, change_minor]
      properties:
        method: {type: string}
        currency: {type: string}
        amount_minor: {type: string}
        change_minor: {type: string}
    DashboardModeAverage:
      type: object
      required: [transactions, units, average_minor]
      properties:
        transactions: {type: integer, description: Transaction count for this mode only (never the all-currency count).}
        units: {type: integer, description: Units sold for this mode only (never the all-currency count).}
        average_minor: {type: string, description: Server-computed truncating integer division of the mode total by the mode count.}
    DashboardOverview:
      type: object
      required: [generated_at, timezone, period, summary, normalized, averages, fx, profit]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string, example: Africa/Cairo}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
        summary:
          type: object
          required: [transaction_count, units_sold, return_transaction_count, units_returned, currency_totals, payment_totals]
          properties:
            transaction_count: {type: integer, description: Finalized sale transactions; returns counted separately.}
            units_sold: {type: integer}
            return_transaction_count: {type: integer}
            units_returned: {type: integer}
            currency_totals:
              type: array
              items: {$ref: '#/components/schemas/DashboardSummaryBucket'}
            payment_totals:
              type: array
              items: {$ref: '#/components/schemas/DashboardSummaryPayment'}
        normalized: {$ref: '#/components/schemas/DashboardNormalized'}
        averages:
          type: object
          required: [all, egp, usd]
          properties:
            all: {$ref: '#/components/schemas/DashboardModeAverage'}
            egp: {$ref: '#/components/schemas/DashboardModeAverage'}
            usd: {$ref: '#/components/schemas/DashboardModeAverage'}
          description: Per-mode server averages (truncating division). Absent currencies report zero transactions with zero average.
        fx: {$ref: '#/components/schemas/DashboardFx'}
        profit:
          type: object
          description: 'Gross profit after refunds: net sales - net tax - net cost (cost of sold lines minus cost of returned lines; lines without a cost add nothing). Per recorded currency, and the whole period in EGP with every sale and refund converted at its own FX snapshot.'
          required: [by_currency, egp]
          properties:
            by_currency:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/DashboardProfitFigures'}
                  - type: object
                    required: [currency]
                    properties:
                      currency: {type: string, enum: [EGP, USD]}
            egp: {$ref: '#/components/schemas/DashboardProfitFigures'}
    DashboardProfitFigures:
      type: object
      required: [net_sales_minor, net_tax_minor, net_cost_minor, profit_minor]
      properties:
        net_sales_minor: {type: string, description: Exact minor units as a decimal string.}
        net_tax_minor: {type: string, description: Exact minor units as a decimal string.}
        net_cost_minor: {type: string, description: Exact minor units as a decimal string.}
        profit_minor: {type: string, description: 'net_sales_minor - net_tax_minor - net_cost_minor.'}
    DashboardDaily:
      type: object
      required: [timezone, period, mode, display_currency, normalized, days]
      properties:
        timezone: {type: string}
        period: {$ref: '#/components/schemas/PeriodMeta'}
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
        mode: {type: string, enum: [all, EGP, USD]}
        display_currency: {type: string, description: Currency unit of amount_minor. Never relabeled client-side.}
        normalized: {type: boolean, description: True only for All mode (historical per-sale FX).}
        days:
          type: array
          items:
            type: object
            required: [date, transactions, units, return_transactions, units_returned, amount_minor, refund_minor]
            properties:
              date: {type: string, description: Store-local calendar date.}
              transactions: {type: integer, description: Finalized sale transactions; returns counted separately.}
              units: {type: integer}
              return_transactions: {type: integer}
              units_returned: {type: integer}
              amount_minor: {type: string, description: Exact minor units in display_currency (normalized EGP in All mode).}
              refund_minor: {type: string, description: Exact refund minor units in display_currency. Nonnegative.}
    DashboardOrderList:
      type: object
      required: [orders, next_cursor, status_counts, webhook_inbox]
      properties:
        orders:
          type: array
          items: {$ref: '#/components/schemas/DashboardOrderSummary'}
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
          description: Opaque keyset continuation token. Null on the final page.
        status_counts:
          type: array
          items: {$ref: '#/components/schemas/DashboardOrderStatusCount'}
        webhook_inbox: {$ref: '#/components/schemas/DashboardWebhookInbox'}
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
      description: Online orders are provider-derived and never Sales.
    DashboardOrderSummary:
      type: object
      required: [provider_key, external_order_id, order_number, provider_status, canonical_status, currency, total_minor, created_at, modified_at, customer_name, mapping_complete, unmapped_line_count, provider_deleted, revision]
      properties:
        provider_key: {type: string}
        external_order_id: {type: string}
        order_number: {type: string}
        provider_status: {type: string}
        canonical_status: {type: string, enum: [pending, processing, on_hold, completed, cancelled, refunded, failed, unknown, deleted]}
        currency: {type: string}
        total_minor: {type: string, description: Exact minor units.}
        created_at: {type: string, format: date-time}
        modified_at: {type: string, format: date-time}
        customer_name: {type: string}
        mapping_complete: {type: boolean}
        unmapped_line_count: {type: integer}
        provider_deleted: {type: boolean}
        revision: {type: integer}
    DashboardOrderStatusCount:
      type: object
      required: [canonical_status, total]
      properties:
        canonical_status: {type: string}
        total: {type: integer}
    DashboardWebhookInbox:
      type: object
      required: [pending, retry, blocked]
      properties:
        pending: {type: integer}
        retry: {type: integer}
        blocked: {type: integer}
        oldest_pending_at: {type: string, format: date-time, nullable: true}
    DashboardOrderDetail:
      type: object
      required: [summary, discount_minor, shipping_minor, cart_tax_minor, total_tax_minor, prices_include_tax, payment_method, payment_method_title, customer_first_name, customer_last_name, customer_email, customer_phone, lines, addresses, status_history]
      properties:
        selection_unresolved_lines: {type: integer, description: 'Lines whose provider selection could not be resolved (F13).'}
        selection_complete: {type: boolean, description: 'False when any line selection is unresolved; companion to base mapping_complete.'}
        summary: {$ref: '#/components/schemas/DashboardOrderSummary'}
        store_id:
          type: string
          format: uuid
          nullable: true
          description: Applied Store ownership scope (Store UUID), or null for the global scope (all Stores plus legacy unscoped rows).
        discount_minor: {type: string, description: Exact minor units.}
        shipping_minor: {type: string, description: Exact minor units.}
        cart_tax_minor: {type: string, description: Exact minor units.}
        total_tax_minor: {type: string, description: Exact minor units.}
        prices_include_tax: {type: boolean}
        paid_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        payment_method: {type: string}
        payment_method_title: {type: string}
        customer_first_name: {type: string}
        customer_last_name: {type: string}
        customer_email: {type: string}
        customer_phone: {type: string}
        lines:
          type: array
          items: {$ref: '#/components/schemas/DashboardOrderLine'}
        addresses:
          type: array
          items: {$ref: '#/components/schemas/DashboardOrderAddress'}
        status_history:
          type: array
          items: {$ref: '#/components/schemas/DashboardOrderStatusEvent'}
    DashboardOrderLine:
      type: object
      required: [external_line_id, external_product_id, variation_id, sku, name, quantity, total_minor, mapped]
      properties:
        external_line_id: {type: integer}
        external_product_id: {type: string}
        variation_id: {type: integer}
        sku: {type: string}
        name: {type: string}
        quantity: {type: integer}
        total_minor: {type: string, description: Exact minor units.}
        moonlight_product_id: {type: string, format: uuid, nullable: true}
        mapped: {type: boolean}
        configuration_id: {type: string, format: uuid, nullable: true, description: 'Purchase-time selection; NULL for NO-FRAME and legacy lines. Immutable (Phase 15-R1 F11).'}
        frame_style_code: {type: string, nullable: true}
        frame_style_name_ar: {type: string, nullable: true}
        frame_style_name_en: {type: string, nullable: true}
        frame_color_code: {type: string, nullable: true}
        frame_color_name_ar: {type: string, nullable: true}
        frame_color_name_en: {type: string, nullable: true}
        configuration_price_delta_minor: {type: string, nullable: true, description: 'Exact minor units in the ORDER currency; NULL = no delta defined for that currency. Never FX, never EGP fallback.'}
        provider_configuration_id: {type: string, nullable: true, description: 'Raw bounded provider identity for the selection.'}
        configuration_unresolved: {type: boolean, description: 'True when the provider selection could not be resolved to a known configuration (F13 truthfulness).'}
        variant_id:
          type: string
          format: uuid
          nullable: true
          description: 'Phase 17 immutable ProductVariant identity snapshot (00034). Null/absent for lines without a resolved provider variation.'
        variant_sku: {type: string, nullable: true, description: 'Frozen variant SKU at ingestion. Never joined from current catalog.'}
        variant_attributes:
          type: array
          description: 'Frozen option attributes (codes + bilingual labels) at ingestion. Later catalog label renames never rewrite them.'
          items:
            type: object
            required: [definition_code, value_code, name_ar, definition_name_ar, position]
            properties:
              definition_code: {type: string}
              value_code: {type: string}
              name_ar: {type: string}
              name_en: {type: string, nullable: true}
              definition_name_ar: {type: string}
              definition_name_en: {type: string, nullable: true}
              position: {type: integer}
    DashboardOrderAddress:
      type: object
      required: [kind, first_name, last_name, company, address_1, address_2, city, state, postcode, country, email, phone]
      properties:
        kind: {type: string, enum: [billing, shipping]}
        first_name: {type: string}
        last_name: {type: string}
        company: {type: string}
        address_1: {type: string}
        address_2: {type: string}
        city: {type: string}
        state: {type: string}
        postcode: {type: string}
        country: {type: string}
        email: {type: string}
        phone: {type: string}
    DashboardOrderStatusEvent:
      type: object
      required: [order_revision, provider_status, canonical_status, observed_at]
      properties:
        order_revision: {type: integer}
        provider_status: {type: string}
        canonical_status: {type: string}
        observed_at: {type: string, format: date-time}
    DashboardTagList:
      type: object
      description: >-
        Bounded Top Tags from canonical historical Tag snapshots. Rows are
        grouped by canonical historical Tag identity (never merged by slug
        across Stores) and ranked deterministically. Tag totals OVERLAP by
        design (a sale line tagged A and B contributes its full
        attributable amount to both rows): overlap_note is mandatory and
        totals must never be summed to derive business revenue. Money is
        exact minor units serialized as strings, per currency bucket.
      required: [generated_at, timezone, store_id, rows, overlap_note]
      properties:
        generated_at: {type: string, format: date-time}
        timezone: {type: string}
        store_id:
          type: string
          format: uuid
          nullable: true
        overlap_note: {type: string}
        rows:
          type: array
          items:
            type: object
            required: [units, units_returned, currencies]
            properties:
              tag_id: {type: string, format: uuid}
              tag_slug: {type: string}
              name_ar: {type: string}
              name_en: {type: string}
              units: {type: integer, format: int64}
              units_returned: {type: integer, format: int64}
              currencies:
                type: array
                items:
                  type: object
                  required: [currency, line_sales_minor, line_refund_minor, net_minor]
                  properties:
                    currency: {type: string, enum: [EGP, USD]}
                    line_sales_minor: {type: string, description: "exact money: integer minor units as string"}
                    line_refund_minor: {type: string, description: "exact money: integer minor units as string"}
                    net_minor: {type: string, description: "exact money: signed, never clamped"}
    DashboardOrderAnalytics:
      type: object
      description: >-
        Operational provider-order aggregate. Retail financial values and
        online-order operational values are distinct sources and are never
        combined into a revenue total. All counts and value breakdowns apply
        the selected Store, provider, period and optional currency scope.
        Aggregate overflow returns a bounded internal error, never wrapped money.
      required: [generated_at, store_id, provider_key, active_statuses, currency_totals, status_counts, provider_totals]
      properties:
        generated_at: {type: string, format: date-time}
        store_id:
          type: string
          format: uuid
          nullable: true
        provider_key: {type: string}
        active_statuses:
          type: array
          items: {type: string}
          description: Exact canonical-status set counted in active_* metrics.
        currency_totals:
          type: array
          items:
            type: object
            required: [currency, orders, value_minor, active_orders, active_value_minor]
            properties:
              currency: {type: string, enum: [EGP, USD]}
              orders: {type: integer, format: int64}
              value_minor: {type: string, description: "exact money: integer minor units as string"}
              active_orders: {type: integer, format: int64}
              active_value_minor: {type: string, description: "exact money: integer minor units as string"}
        status_counts:
          type: array
          items:
            type: object
            required: [canonical_status, orders]
            properties:
              canonical_status: {type: string}

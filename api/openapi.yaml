openapi: 3.0.3
info:
  title: MoonLightCloud API
  description: >-
    Device lifecycle + versioned sync ingestion with the first Sale-sync
    vertical slice: durable inbox, sale.finalized.v1 validated before ACK,
    async projection with durable processing state. Business APIs are
    versioned under /api/v1. Health and version stay outside the version
    boundary. ACK means durable PostgreSQL commit, never queueing alone.
  version: 2D
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /health/ready:
    get:
      summary: Readiness probe
      operationId: healthReady
      description: >-
        Returns 200 only when PostgreSQL is reachable and the schema is
        compatible. Otherwise 503.
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /version:
    get:
      summary: Build version metadata
      operationId: version
      responses:
        '200':
          description: Version metadata (no secrets).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/device-control/poll:
    post:
      summary: Retail control poll (lease at most one due command, refresh presence)
      operationId: deviceControlPoll
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Server time plus at most one leased command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceControlPollResponse'
        '401':
          description: Missing, unknown, revoked, or invalid credential (presence untouched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/commands/{id}/accepted:
    post:
      summary: Report durable Retail receipt (idempotent)
      operationId: deviceControlAccepted
      security:
        - deviceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current command state after accepted receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceControlCommandResponse'
        '401':
          description: Missing, unknown, revoked, or invalid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or cross-device lookup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/commands/{id}/status:
    post:
      summary: Report running/completed/failed (first terminal wins)
      operationId: deviceControlStatus
      security:
        - deviceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceControlStatusReport'
      responses:
        '200':
          description: Current command state after the report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceControlCommandResponse'
        '400':
          description: Malformed body, unknown status, or invalid result code (DEVICE_COMMAND_INVALID_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, unknown, revoked, or invalid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or cross-device lookup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Contradictory terminal outcome (DEVICE_COMMAND_CONFLICT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents:
    get:
      summary: Bounded incident list with state/severity/rule filters
      operationId: operationsIncidents
      security:
        - dashboardSession: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, acknowledged, resolved]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [warning, urgent]
        - name: rule
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One bounded page plus next_cursor (empty when final).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentList'
        '400':
          description: Invalid filter, limit, or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents/{id}:
    get:
      summary: Incident detail with masked deliveries and recovery state
      operationId: operationsIncidentDetail
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incident with deliveries (recipients masked) and recoveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentDetail'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents/{id}/acknowledge:
    post:
      summary: Acknowledge an incident (idempotent, never resolves)
      operationId: operationsAcknowledge
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current incident state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentResponse'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/incidents/{id}/resolve:
    post:
      summary: Resolve an event incident, or a cleared stateful condition
      operationId: operationsResolve
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current incident state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsIncidentResponse'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Stateful condition still active (CONDITION_STILL_ACTIVE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/summary:
    get:
      summary: Aggregate counters and batched device incident rollup
      operationId: operationsSummary
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Low-cardinality counters plus per-device aggregates.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/operations/devices/summary:
    get:
      summary: Per-device active incident counts in one batched read
      operationId: operationsDeviceSummary
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Device rollup array (never per-device queries).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/devices:
    get:
      summary: Operator device connectivity + latest sync command
      operationId: dashboardDevices
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Devices with NEVER_SEEN/ONLINE/OFFLINE connectivity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDeviceList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/commands:
    get:
      summary: Store-scoped catalog command history (newest first)
      operationId: catalogAdminListCommands
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
        - name: type
          in: query
          schema:
            type: string
          description: Optional versioned command type filter.
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
          description: Optional entity filter.
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CANCELLED]
          description: Optional command status filter.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            Opaque keyset cursor from a previous response's next_cursor.
            Empty starts newest. Cursors are bound to the exact
            Store+filter scope; concurrent inserts never shift
            already-returned pages (no duplicates, no skips).
      responses:
        '200':
          description: Paginated command history with per-device targets and aggregate state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommandList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Create a typed Store-scoped catalog command (durable intent only)
      operationId: catalogAdminCreateCommand
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogAdminCreateRequest'
      responses:
        '200':
          description: "Command persisted with per-device targets snapshotted. Creation is not success: Retail must still apply it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommand'
        '400':
          description: Unknown type, cross-Store entity, unknown entity, or invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/commands/{id}:
    get:
      summary: One catalog command with targets and aggregate state
      operationId: catalogAdminGetCommand
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Command detail. Append ?payload=1 to include the immutable payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommand'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/commands/{id}/cancel:
    post:
      summary: Cancel a pending catalog command (never rolls back applied work)
      operationId: catalogAdminCancelCommand
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Command with updated state. Delivered or applied commands cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCommand'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown command or cross-Store access (returned as not found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Command was delivered or applied and cannot be safely cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products:
    get:
      summary: Store-scoped admin Product list with pending flags
      operationId: catalogAdminProducts
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 64
          description: Bounded SKU/name substring. Empty lists newest.
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            Opaque scope-bound keyset cursor from a previous response's
            next_cursor. Empty starts newest. The cursor is bound to the
            exact Store+search scope that produced it; reuse under a
            different Store or search is rejected (400) rather than
            silently continuing another scope's list.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Products with SKU, revisions, online state, read-only stock and pending flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products/{id}:
    get:
      summary: Store-scoped admin Product detail snapshot
      operationId: catalogAdminProduct
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Current projection values plus all revision streams. Money stays exact minor-unit strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductDetail'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown Product or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products/{id}/configurations:
    get:
      summary: Current frame options for the editor
      operationId: catalogAdminConfigurations
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Current frame options with IDs so edits update rows instead of duplicating them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminConfigurationList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown Product or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/products/{id}/variants:
    get:
      summary: Projected product variants (Phase 17)
      operationId: catalogAdminProductVariants
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Variant rows with option attributes, exact minor-unit prices and read-only last-known stock. Tombstones are flagged (deleted), never hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductVariantList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown Product or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/categories:
    get:
      summary: Store-scoped Category tree rows
      operationId: catalogAdminCategories
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Categories with parents, status, online policy, revisions and pending flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminCategoryList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/tags:
    get:
      summary: Store-scoped Tag rows
      operationId: catalogAdminTags
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Tags with revisions and pending flags. Historical Sale tags are untouched snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminTagList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/product-types:
    get:
      summary: Store-scoped ProductType rows with dimensions and capabilities
      operationId: catalogAdminProductTypes
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Structural types (Retail authority). Codes are stable identity; labels are display state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductTypeList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/catalog-admin/product-types/{id}:
    get:
      summary: Store-scoped ProductType detail snapshot
      operationId: catalogAdminProductType
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StoreScope'
      responses:
        '200':
          description: Current projection values plus the type revision stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminProductTypeDetail'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown ProductType or wrong Store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/catalog-commands:
    get:
      summary: Retail pulls due catalog command targets (outbound only)
      operationId: deviceCatalogCommands
      security:
        - deviceAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Bounded due targets for the calling device only. At most 50 commands and 128 KiB of encoded JSON; a byte-bounded prefix is delivered and the remainder stays due.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCatalogCommandList'
        '401':
          description: Missing or invalid device credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/catalog-commands/{target_id}/result:
    post:
      summary: Retail reports one command target outcome
      operationId: deviceCatalogCommandResult
      security:
        - deviceAuth: []
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCatalogCommandResult'
      responses:
        '200':
          description: Outcome recorded. Wrong-device reports are rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCatalogCommandAck'
        '401':
          description: Missing or invalid device credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown target, wrong device, inactive device or device rebound to another Store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Contradictory terminal outcome or cancelled command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/device-control/capabilities:
    post:
      summary: Retail announces command capabilities
      operationId: deviceCapabilities
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCapabilities'
      responses:
        '200':
          description: Capability recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCapabilityResult'
        '401':
          description: Missing or invalid device credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/stores:
    get:
      summary: Registered Stores with bound device counts (read-only)
      operationId: dashboardStores
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Store registry snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStoreList'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/dashboard/devices/{device_id}/sync-requests:
    post:
      summary: Queue sync_now.v1 (Idempotency-Key required, one active per device)
      operationId: dashboardSyncRequest
      security:
        - dashboardSession: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: Caller-generated idempotency key, unique per device. Missing or invalid keys are rejected with 400 DEVICE_COMMAND_INVALID_IDEMPOTENCY_KEY.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_:.~-]{1,128}$
      responses:
        '201':
          description: Command created (pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSyncRequestResponse'
        '200':
          description: Same-key idempotent replay returns the existing command with created=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSyncRequestResponse'
        '400':
          description: Invalid idempotency key or inactive device (DEVICE_COMMAND_INVALID_IDEMPOTENCY_KEY / DEVICE_NOT_ACTIVE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Contradictory reuse (DEVICE_COMMAND_CONFLICT) or another sync already active for this device (DEVICE_SYNC_ALREADY_ACTIVE). Returns only the error envelope; no command is returned.
          content:
            application/json:
              schema:

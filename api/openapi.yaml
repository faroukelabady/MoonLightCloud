              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items: {$ref: '#/components/schemas/ReleaseView'}
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Import a signed release envelope (Cloud verifies; never signs)
      description: >-
        The body carries the signed envelope exactly as produced by offline
        release tooling plus one HTTPS location per signed artifact file name.
        Version, commit, sequence, hashes and signature are never typed by an
        operator. Verification uses RELEASE_TRUSTED_PUBLIC_KEYS only; Cloud
        holds no private signing key. Same sequence with a different digest is
        a conflict; re-importing identical bytes is idempotent (200).
      operationId: dashboardImportRelease
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseImportRequest'}
      responses:
        '201':
          description: Release verified and registered (immutable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseView'}
        '200':
          description: Identical envelope already registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseView'}
        '400':
          description: >-
            Invalid body, unknown fields, envelope verification failure
            (message is the stable code, e.g. UPDATE_SIGNATURE_INVALID,
            UPDATE_KEY_UNKNOWN, UPDATE_MANIFEST_INVALID) or a missing / non-HTTPS
            artifact location.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: Missing or invalid operator session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: Cross-origin mutation refused.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: RELEASE_SEQUENCE_CONFLICT or RELEASE_TRUST_NOT_CONFIGURED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

      operationId: dashboardTags
      security:
        - dashboardSession: []
      description: >-
        Bounded Top-N Tag ranking through the canonical report breakdown:
        rows are grouped by canonical historical Tag identity (never merged
        by slug across Stores), attributed from sale-time Tag snapshots,
        ranked deterministically (net line sales per currency bucket in a
        currency scope; units otherwise, with a complete identity
        tie-break) and truncated to limit. Tag totals OVERLAP by design —
        a sale line tagged A and B contributes its full attributable amount
        to both rows — and must never be summed to derive total revenue.
        Money is exact minor units per currency bucket; currencies are
        never summed and never FX-converted. Retail financial values only:
        provider online orders are never included here.
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
        - $ref: '#/components/parameters/ReportFromDate'
        - $ref: '#/components/parameters/ReportToDate'
        - $ref: '#/components/parameters/ReportCurrency'
        - $ref: '#/components/parameters/StoreScope'
        - $ref: '#/components/parameters/TopNLimit'
      responses:
        '200':
          description: Ranked Tag rows with per-currency exact-money buckets (strings) and the mandatory non-additive disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTagList'
        '400':
          description: Invalid period, dates, currency, store_id or limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':

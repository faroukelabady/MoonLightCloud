  /api/v1/sync/media/{sha256}:
    put:
      summary: Upload one Retail product image by its SHA-256
      description: ADR-0056 and ADR-0057. Content-addressed and idempotent - the first upload stores the file, a repeat answers already_stored. The body must hash to the path, decode as the declared format and stay within 20,000,000 pixels. Gallery state travels separately as catalog.product.media.snapshot.v1. The bytes are written to object storage (a private R2 bucket; a local directory in development) before the PostgreSQL record is committed and the success response is sent. PostgreSQL never stores the bytes.
      operationId: syncMediaUpload
      security:
        - deviceAuth: []
      parameters:
        - name: sha256
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The file was already stored; its object was written again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResult'
        '201':
          description: The file was stored in object storage and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResult'
        '400':
          description: The path is not 64 lower-case hex characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, unknown, revoked, or invalid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: The body is larger than 5 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Content-Type is not image/jpeg or image/png.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: The body does not match the hash (message MEDIA_HASH_MISMATCH) or is not a valid image of the declared type (message INVALID_MEDIA). Not retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Cloud could not commit the image. Retry with the same hash and bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Object storage is unavailable. Nothing is recorded. Retry with the same hash and bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/batches:
    post:
      summary: Durably ingest a batch of sync events (all-or-nothing)
      operationId: syncBatches
      security:
        - deviceAuth: []
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: application/json
          description: Must be application/json (415 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
      responses:
        '200':
          description: >-
            Batch durably committed. Per-event accepted/already_accepted.
            ACK means PostgreSQL commit, not queueing or projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          description: Malformed envelope or duplicate IDs inside batch. Not retryable without fixing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid device authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Event device_id does not match authenticated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: EVENT_ID_REUSE — same event ID with different device or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Batch or payload exceeds limits. Shrink and resend as new batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: UNSUPPORTED_EVENT for an unknown event type; INVALID_EVENT for invalid semantics of a supported event (including an absurd timestamp). Not retryable as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Temporary reporting dependency unavailable (PostgreSQL unreachable/timeout). Generic UNAVAILABLE envelope. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # ---- Human authentication (Phase 18 R1, ADR-0053) ----
  # There is no registration endpoint and no default account. The first
  # OWNER is created by the server-side CLI (`moonlight-cloud auth
  # bootstrap-owner`), never over HTTP. Mutations need a same-origin
  # Origin/Referer AND the session's X-CSRF-Token.
  /api/v1/dashboard/auth/login:
    post:
      summary: Primary (password) authentication; starts an MFA stage
      description: >-
        Same-origin only. Never yields a FULL session directly: the response
        stage is MFA_PENDING (verify a TOTP or recovery code) or MFA_SETUP
        (enroll TOTP first). Every failure (unknown account, wrong password,
        disabled account) is the same 401; account and network throttling
        answer 429 for a bounded time.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthLoginRequest'}
      responses:
        '200':
          description: Password accepted; challenge session cookie set (HttpOnly, SameSite=Strict, Secure + __Host- prefix outside development).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResult'}
        '400':
          description: Malformed or oversized body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: INVALID_CREDENTIALS (generic, identical for every cause).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED (missing or foreign Origin).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: RATE_LIMITED (temporary account or network throttle); Retry-After set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/auth/activate:
    post:
      summary: Consume a one-time activation token and set the first password
      description: >-
        Single-use, short-lived (24 h) token created by an OWNER. Returns an
        MFA_SETUP session; the account becomes ACTIVE only after TOTP
        enrollment.
      operationId: authActivate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: {type: string, maxLength: 128}
                password: {type: string, description: '12 to 256 characters; never truncated.'}
      responses:
        '200':
          description: Activated; MFA_SETUP session cookie set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResult'}
        '400':
          description: ACTIVATION_INVALID (unknown, used or expired) or WEAK_PASSWORD.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/auth/me:
    get:
      summary: Current human, stage, permissions and Store access
      description: Works in every session stage. Returns no credential material other than the session CSRF token.
      operationId: authMe
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthMe'}
        '401':
          description: AUTH_REQUIRED (no, unknown, expired, revoked or superseded session).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (missing permission), STORE_FORBIDDEN / STORE_SCOPE_REQUIRED (Store membership), MFA_REQUIRED / MFA_SETUP_REQUIRED (session not FULL) or CSRF_REJECTED (mutations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/dashboard/auth/logout:
    post:
      summary: Revoke the server-side session and clear the cookie
      operationId: authLogout
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Session revoked; replaying the old cookie is rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: {type: boolean}
        '401':
          description: AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/auth/mfa/verify:
    post:
      summary: Complete an MFA_PENDING session with a TOTP or one-time recovery code
      description: >-
        RFC 6238 TOTP (30 s, 6 digits, one adjacent step tolerated); a step is
        accepted once (replay rejected). Recovery codes are single-use. On
        success the session is rotated to FULL (old cookie revoked).
      operationId: authMFAVerify
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: {type: string, pattern: '^[0-9 ]{6,7}$'}
                recovery_code: {type: string, maxLength: 32}
      responses:
        '200':
          description: FULL session; rotated cookie set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResult'}
        '401':
          description: INVALID_MFA_CODE or AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED or the session is not MFA_PENDING.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: RATE_LIMITED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/auth/mfa/enroll/start:
    post:
      summary: Generate the TOTP secret for an MFA_SETUP session (shown once)
      description: The secret is stored only AES-256-GCM encrypted under AUTH_MFA_ENCRYPTION_KEY.
      operationId: authMFAEnrollStart
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Provisioning material.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: {type: string, description: 'Base32 secret for manual authenticator entry.'}
                  otpauth_uri: {type: string}
        '401':
          description: AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED or the session is not MFA_SETUP.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/auth/mfa/enroll/confirm:
    post:
      summary: Verify the first TOTP code, enable MFA and receive recovery codes once
      operationId: authMFAEnrollConfirm
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200':
          description: MFA enabled; FULL session; ten one-time recovery codes (stored only as digests).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResult'}
        '401':
          description: INVALID_MFA_CODE or AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED or the session is not MFA_SETUP.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/auth/mfa/recovery-codes:
    post:
      summary: Regenerate recovery codes (previous codes stop working)
      operationId: authRecoveryCodes
      security:
        - dashboardSession: []
      responses:
        '200':
          description: New codes, shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: {type: array, items: {type: string}}
        '401':
          description: AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED or MFA not completed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/auth/password:
    post:
      summary: Change own password (other sessions revoked, current rotated)
      operationId: authChangePassword
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string}
      responses:
        '200':
          description: Changed; rotated session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResult'}
        '400':
          description: WEAK_PASSWORD.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: INVALID_CREDENTIALS (current password) or AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: CSRF_REJECTED or MFA not completed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/users:
    get:
      summary: List human accounts (users.read; OWNER)
      operationId: usersList
      security:
        - dashboardSession: []
      parameters:
        - name: after
          in: query
          schema: {type: string, maxLength: 254}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Page of accounts visible to the caller (no credential material).
          content:
            application/json:
              schema:
                type: object
                required: [users, next_cursor]
                properties:
                  users: {type: array, items: {$ref: '#/components/schemas/HumanUser'}}
                  next_cursor: {type: string}
        '401':
          description: AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (no users.read) or MFA not completed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    post:
      summary: Create an account in PENDING_SETUP and return a one-time activation token (users.manage)
      description: >-
        OWNER only. A Store-restricted OWNER can only grant its own Stores
        and never all-Stores access; only an all-Stores OWNER may create
        another OWNER.
      operationId: usersCreate
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, display_name, role]
              properties:
                login: {type: string}
                display_name: {type: string, maxLength: 100}
                role: {type: string, enum: [owner, admin]}
                all_stores: {type: boolean}
                store_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '201':
          description: Created; the activation token is returned exactly once.
          content:
            application/json:
              schema:
                type: object
                required: [user, activation_token]
                properties:
                  user: {$ref: '#/components/schemas/HumanUser'}
                  activation_token: {type: string}
        '400':
          description: INVALID_INPUT.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN or CSRF_REJECTED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: LOGIN_TAKEN.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/v1/dashboard/users/{id}/{action}:
    post:
      summary: Account administration (users.manage; mfa-reset needs security.manage)
      description: >-
        action: activation (new one-time token, PENDING_SETUP only) | role
        {role} | status {status: ACTIVE|DISABLED} | memberships {all_stores,
        store_ids} | mfa-reset | sessions-revoke. Role/status/MFA changes
        invalidate the target's sessions. The last active OWNER can never be
        disabled or demoted (409 LAST_OWNER), enforced transactionally.
      operationId: usersAction
      security:
        - dashboardSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [activation, role, status, memberships, mfa-reset, sessions-revoke]}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: {type: string, enum: [owner, admin]}
                status: {type: string, enum: [active, disabled]}
                all_stores: {type: boolean}
                store_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Updated account, activation token, or revocation result.
          content:
            application/json:
              schema: {type: object}
        '400':
          description: INVALID_INPUT.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401':
          description: AUTH_REQUIRED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: FORBIDDEN (permission, Store reach) or CSRF_REJECTED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: Unknown account or action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: LAST_OWNER or STATE_CONFLICT.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

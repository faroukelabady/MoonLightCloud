version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - "db/migrations/00001_devices.sql"
      - "db/migrations/00002_device_credentials.sql"
      - "db/migrations/00003_sync_events.sql"
      - "db/migrations/00004_sale_projection.sql"
      - "db/migrations/00005_sync_event_processing.sql"
      - "db/migrations/00006_sync_event_hash_version.sql"
      - "db/migrations/00007_sale_event_ownership.sql"
      - "db/migrations/00008_return_refund_projection.sql"
      - "db/migrations/00009_catalog_projection.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapter/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_exact_table_names: false
        emit_empty_slices: true

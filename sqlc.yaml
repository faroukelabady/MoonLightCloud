version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - "db/migrations/00001_devices.sql"
      - "db/migrations/00002_device_credentials.sql"
      - "db/migrations/00003_sync_events.sql"
      - "db/migrations/00004_sale_projection.sql"
      - "db/migrations/00005_sync_event_processing.sql"
      - "db/migrations/00006_sync_event_hash_version.sql"
      - "db/migrations/00007_sale_event_ownership.sql"
      - "db/migrations/00008_return_refund_projection.sql"
      - "db/migrations/00009_catalog_projection.sql"
      - "db/migrations/00010_product_sales_policy.sql"
      - "db/migrations/00011_product_inventory.sql"
      - "db/migrations/00012_commerce_product_mappings.sql"
      - "db/migrations/00013_commerce_orders.sql"
      - "db/migrations/00014_order_concurrency_fences.sql"
      - "db/migrations/00015_notifications.sql"
      - "db/migrations/00016_business_reports.sql"
      - "db/migrations/00017_device_connectivity_control.sql"
      - "db/migrations/00018_device_control_pending_lease_constraint.sql"
      - "db/migrations/00019_operational_alerts.sql"
      - "db/migrations/00020_operational_integrity.sql"
      - "db/migrations/00021_sale_historical_tags.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapter/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_exact_table_names: false
        emit_empty_slices: true
